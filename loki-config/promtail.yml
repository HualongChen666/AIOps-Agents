# Promtail Configuration for AIOps Agent
# Log collection agent configuration (Promtail 2.9.x schema).
#
# Deployed by deploy/docker-compose.monitoring.yml. It tails:
#   * the AIOps agent log directory (repository ./logs -> /var/log/aiops-agent)
#   * every Docker container log via the mounted docker socket
# and pushes to Loki at http://loki:3100.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

# Position configuration (persisted in the promtail-positions volume mounted at /tmp)
positions:
  filename: /tmp/positions.yaml

# Loki client configuration
clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # AIOps Agent application logs
  - job_name: aiops-agent
    static_configs:
      - targets:
          - localhost
        labels:
          job: aiops-agent
          service: api
          environment: production
          cluster: aiops-agent
          region: default
          __path__: /var/log/aiops-agent/*.log
    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
            trace_id: trace_id
            span_id: span_id
      # Parse timestamp
      - timestamp:
          source: timestamp
          format: RFC3339
      # Promote structured fields to labels
      - labels:
          level:
          service:
          trace_id:
          span_id:
      # Drop debug logs in production
      - match:
          selector: '{level="debug"}'
          action: drop

  # Docker container logs (service discovery + log tailing via the mounted socket)
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container_name
      - source_labels: ['__meta_docker_container_id']
        target_label: container_id

# Limit configuration
limits_config:
  readline_rate: 10000
  readline_burst: 20000
  max_line_size: 1048576
  max_streams: 0

# Target configuration
target_config:
  sync_period: 10s
