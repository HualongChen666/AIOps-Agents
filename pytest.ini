[pytest]
# pytest配置文件 - 提升测试稳定性

# 测试发现模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试路径 - 默认只跑稳定的 core 单测，其它目录通过标记/CI 单独执行
testpaths = tests/core
pythonpath = .

# 忽略的目录
norecursedirs = tests/standalone, tests/disabled, tests/integration, tests/e2e, tests/addons

# 标记定义
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    api: marks tests as API tests
    e2e: marks tests as end-to-end tests
    performance: marks tests as performance tests
    core: core functionality, always run
    addons: requires ENABLE_ADDONS=true
    smoke: heavy module introspection smoke tests (run separately)
    timeout: per-test timeout override (seconds)

# 最小pytest版本
minversion = 7.0

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 覆盖率配置
addopts =
    --strict-markers
    --disable-warnings
    --tb=short
    --verbose
    --showlocals
    -n auto
    --no-cov
    -p no:unraisableexception
    -m "not performance and not addons and not e2e and not api and not integration and not smoke"

# 超时配置
timeout = 30
timeout_method = thread

# 异步测试支持
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 并行测试配置
# pytest-xdist配置：-n auto 自动检测CPU核心数
# 注意：确保测试间无共享状态，每个测试独立运行
# 如有共享状态问题，使用 -n 1 禁用并行测试

# 测试输出
console_output_style = progress

# 警告设置
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ImportWarning
    ignore::pytest.PytestDeprecationWarning
    ignore:.*asyncio_default_fixture_loop_scope.*:pytest.PytestDeprecationWarning