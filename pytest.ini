[pytest]
# Pytest配置文件

# 测试发现模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试路径
testpaths = tests

# 输出选项
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=core
    --cov=api
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=70
    -n auto
    --asyncio-mode=auto

# 标记定义
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    core: marks tests as core module tests
    skip_db: marks tests that should be skipped when database is not available
    smoke: marks tests as smoke tests
    api: marks tests as API tests
    security: marks tests as security tests
    performance: marks tests as performance tests

# 最小Python版本
minversion = 7.0

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 覆盖率配置
[coverage:run]
source = .
omit = 
    */tests/*
    */__pycache__/*
    */venv/*
    */env/*
    */virtualenv/*
    */.venv/*
    services/*
    migrations/*
    alembic/*
    .git/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
