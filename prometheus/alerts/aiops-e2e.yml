# E2E smoke alert rules.
#
# These rules exist to exercise the full alert path in the docker E2E stack:
#   Prometheus -> Alertmanager -> AIOps webhook (/api/v1/alerts/webhook/prometheus).
# They therefore use thresholds that fire on a healthy developer machine, but they
# read REAL node_exporter series (no `vector(1)` synthetic constant), so the
# expression and the annotation describe the same signal.

groups:
  - name: software
    interval: 10s
    rules:
      - alert: E2EMemoryHigh
        expr: (1 - (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"})) * 100 > 1
        for: 0s
        labels:
          severity: warning
          category: software
          platform: linux
          instance: e2e-host
        annotations:
          summary: "Memory usage high (E2E smoke)"
          description: "Node memory in use on {{ $labels.instance }} is {{ $value | printf \"%.1f\" }}%"

  - name: hardware
    interval: 10s
    rules:
      - alert: E2EDiskPressure
        expr: (1 - (node_filesystem_avail_bytes{job="node-exporter",mountpoint="/"} / node_filesystem_size_bytes{job="node-exporter",mountpoint="/"})) * 100 > 1
        for: 0s
        labels:
          severity: critical
          category: hardware
          platform: linux
          instance: e2e-host
        annotations:
          summary: "Disk pressure on root filesystem (E2E smoke)"
          description: "Root filesystem usage on {{ $labels.instance }} is {{ $value | printf \"%.1f\" }}%"
