global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'aiops-production'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - "/etc/prometheus/alerts/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 10s

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 10s

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 10s

  - job_name: 'aiops-application'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/api/v1/apm/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'aiops-health'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/api/v1/apm/health'
    scrape_interval: 30s
    scrape_timeout: 5s