# Mypy configuration for AIOps Agent - Type Safety Improvement
[mypy]
python_version = 3.12
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = false
check_untyped_defs = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Exclude virtual environment, external dependencies, backups, and temporary files
exclude = (?x)(
    venv/|
    external/|
    \.venv/|
    build/|
    dist/|
    __pycache__/|
    tests/|
    scripts/|
    core_backup/|
    autobackup/|
    temp/|
    logs/|
    tmp_.*\.py$
  )

# Gradual typing - start with moderate strictness
disallow_untyped_defs = false
strict_optional = true
no_implicit_optional = false

# Enable useful warnings
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true

# Specific module configurations can be added here as needed
[mypy-modules.*]
disallow_untyped_defs = false
no_implicit_optional = false