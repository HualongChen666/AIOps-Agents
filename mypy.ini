# Mypy configuration for AIOps Agent - Type Safety Improvement
[mypy]
python_version = 3.12
ignore_missing_imports = true
# Required so that top-level script/test trees (scripts/, tests/) and the
# add-on trees (extensions/) can be checked without an __init__.py in every dir.
explicit_package_bases = true
namespace_packages = true
warn_return_any = true
warn_unused_configs = false
check_untyped_defs = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Exclude only non-source artifacts. First-party trees (core/, api/, services/,
# extensions/, modules/, tests/, scripts/, docs/) are intentionally IN scope so
# the type gate actually covers the code we ship.
exclude = (?x)(
    venv/|
    external/|
    \.venv/|
    build/|
    dist/|
    __pycache__/|
    core_backup/|
    autobackup/|
    temp/|
    logs/|
    tmp_.*\.py$|
    node_modules/|
    \.mypy_cache/|
  )

# Gradual typing - start with moderate strictness
disallow_untyped_defs = false
strict_optional = true
no_implicit_optional = false

# Enable useful warnings
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true

# Specific module configurations can be added here as needed
[mypy-modules.*]
disallow_untyped_defs = false
no_implicit_optional = false