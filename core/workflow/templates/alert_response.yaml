name: alert_response
description: Automated alert response workflow for incident handling

nodes:
  - id: collect_context
    name: Collect Alert Context
    type: task
    config:
      timeout: 30
      max_retries: 2
    dependencies: []

  - id: analyze_severity
    name: Analyze Alert Severity
    type: task
    config:
      timeout: 60
      max_retries: 3
    dependencies: [collect_context]

  - id: check_playbook
    name: Check for Runbook
    type: task
    config:
      timeout: 30
      max_retries: 2
    dependencies: [analyze_severity]

  - id: execute_remediation
    name: Execute Remediation
    type: task
    config:
      timeout: 300
      max_retries: 2
    dependencies: [check_playbook]

  - id: verify_fix
    name: Verify Fix
    type: task
    config:
      timeout: 120
      max_retries: 3
    dependencies: [execute_remediation]

  - id: notify_team
    name: Notify Team
    type: task
    config:
      timeout: 30
      max_retries: 3
    dependencies: [verify_fix]

edges:
  - from: collect_context
    to: analyze_severity
  - from: analyze_severity
    to: check_playbook
    condition: severity >= warning
  - from: check_playbook
    to: execute_remediation
    condition: playbook_exists
  - from: execute_remediation
    to: verify_fix
  - from: verify_fix
    to: notify_team
