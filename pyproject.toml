[tool.pydocstyle]
convention = "google"
# Removed ignore to enforce docstring checks
# skip any directories if needed, currently none

[tool.poetry]
name = "aiops-agent"
version = "0.1.0"
description = "Self-hosted AI SRE that turns Prometheus alerts into approved, verified, auditable repairs for software and hardware incidents."
authors = ["AIOps Team <aiops@example.com>"]
readme = "README.md"
python = "^3.10"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = ">=0.109.1"
uvicorn = {version = ">=0.24.0", extras = ['standard']}
pydantic = {version = ">=2.4.0,<2.12.0", extras = ['email']}
pydantic-settings = ">=2.0.0"
sqlalchemy = ">=2.0.35"
asyncpg = ">=0.30.0"
psycopg2-binary = ">=2.9.9"
alembic = ">=1.13.0"
redis = ">=5.2.0"
hiredis = ">=3.0.0"
qdrant-client = ">=1.12.0"
neo4j = ">=5.26.0"
openai = ">=1.50.0"
langchain = ">=0.3.0"
langchain-openai = ">=0.2.0"
anthropic = ">=0.40.0"
sentence-transformers = ">=3.1.0"
prometheus-client = ">=0.19.0"
opentelemetry-api = "==1.27.0"
opentelemetry-sdk = "==1.27.0"
opentelemetry-instrumentation-fastapi = "==0.48b0"
opentelemetry-instrumentation-sqlalchemy = "==0.48b0"
opentelemetry-instrumentation-redis = "==0.48b0"
opentelemetry-instrumentation-httpx = "==0.48b0"
opentelemetry-exporter-otlp-proto-grpc = "==1.27.0"
opentelemetry-propagator-b3 = "==1.27.0"
opentelemetry-propagator-jaeger = "==1.27.0"
protobuf = ">=3.19,<5.0"
wrapt = ">=1.16.0"
loguru = ">=0.7.0"
python-json-logger = ">=2.0.0"
httpx = ">=0.27.2"
aiohttp = ">=3.13.3"
cryptography = ">=43.0.0"
pyjwt = {version = ">=2.13.0", extras = ['crypto']}
passlib = {version = ">=1.7.4", extras = ['bcrypt']}
python-multipart = ">=0.0.18"
authlib = ">=1.3.1"
slowapi = ">=0.1.9"
python-dotenv = ">=1.0.0"
pytz = ">=2023.3"
openpyxl = ">=3.1.0"
setuptools = ">=78.1.1"
apscheduler = ">=3.10.0"
tenacity = ">=8.2.0"
cachetools = ">=5.3.0"
orjson = ">=3.9.0"
watchdog = ">=3.0.0"
strawberry-graphql = ">=0.219.0"
docker = ">=7.1.0"
pandas = ">=2.2.0"
pyotp = ">=2.10.0"
qrcode = ">=8.1.0"
Pillow = ">=11.3.0"
resource = ">=0.2.1"
psutil = ">=6.1.0"
[tool.poetry.dev-dependencies]
pytest = "^7.0"

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(?:
  \.git
  | \.venv
  | venv
  | build
  | dist
  | __pycache__
  | \.pytest_cache
  | \.mypy_cache
  | \.tox
  | \.hg
  | \.eggs
  | \.egg-info
  | temp
  | verify_logs
)/|(?:^|/)temp_[^/]*\.py$
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["api", "core", "tests", "scripts", "infrastructure", "main", "services"]
skip = [".git", "__pycache__", ".venv", "venv", "build", "dist", ".eggs", "*.egg-info", ".pytest_cache", ".mypy_cache", ".tox"]
skip_glob = ["**/temp*", "verify_logs/**"]

[tool.bandit]
# B404 is the one subprocess import inside the secure subprocess_runner wrapper;
# the actual code fix is centralizing all subprocess usage in that module.
skips = ["B404"]
exclude_dirs = ["tests", "venv", ".venv", "node_modules", ".next", ".git", "__pycache__", ".pytest_cache", ".mypy_cache"]
