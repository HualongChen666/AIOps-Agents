{{- if .Values.monitoring.enabled -}}
{{- if .Values.monitoring.prometheusRules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "aiops-agent.fullname" . }}-rules
  labels:
    {{- include "aiops-agent.labels" . | nindent 4 }}
    release: prometheus
spec:
  groups:
    {{- range .Values.monitoring.prometheusRules.rules }}
    - name: {{ .name }}
      rules:
        {{- toYaml .rules | nindent 8 }}
    {{- end }}
{{- end }}
{{- end }}
