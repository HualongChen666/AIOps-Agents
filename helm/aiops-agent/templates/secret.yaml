apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aiops-agent.fullname" . }}-secret
  labels:
    {{- include "aiops-agent.labels" . | nindent 4 }}
type: Opaque
data:
  # JWT secret key - should be overridden with a strong random value
  JWT_SECRET_KEY: {{ .Values.secret.jwtSecretKey | default (randAlphaNum 32) | b64enc | quote }}
  # Database connection string (if using external database)
  {{- if .Values.secret.databaseUrl }}
  DATABASE_URL: {{ .Values.secret.databaseUrl | b64enc | quote }}
  {{- end }}
  # Redis connection string (if using external Redis)
  {{- if .Values.secret.redisUrl }}
  REDIS_URL: {{ .Values.secret.redisUrl | b64enc | quote }}
  {{- end }}
  # API keys for external services
  {{- if .Values.secret.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secret.openaiApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secret.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secret.anthropicApiKey | b64enc | quote }}
  {{- end }}
