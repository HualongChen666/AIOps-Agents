apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aiops-agent.fullname" . }}
  labels:
    {{- include "aiops-agent.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "aiops-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "aiops-agent.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "aiops-agent.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        - name: metrics
          containerPort: {{ .Values.aiops.prometheus.port }}
          protocol: TCP
        env:
        - name: LOG_LEVEL
          value: {{ .Values.aiops.logLevel | quote }}
        - name: OTEL_ENABLED
          value: {{ .Values.aiops.otel.enabled | quote }}
        - name: OTEL_ENDPOINT
          value: {{ .Values.aiops.otel.endpoint | quote }}
        - name: ANOMALY_DETECTION_ENABLED
          value: {{ .Values.aiops.anomalyDetection.enabled | quote }}
        - name: ANOMALY_DETECTION_MODEL
          value: {{ .Values.aiops.anomalyDetection.model | quote }}
        - name: ANOMALY_DETECTION_THRESHOLD
          value: {{ .Values.aiops.anomalyDetection.threshold | quote }}
        - name: AUTO_HEAL_ENABLED
          value: {{ .Values.aiops.autoHeal.enabled | quote }}
        - name: AUTO_HEAL_MAX_RETRIES
          value: {{ .Values.aiops.autoHeal.maxRetries | quote }}
        - name: SAMPLING_ENABLED
          value: {{ .Values.aiops.sampling.enabled | quote }}
        - name: SAMPLING_DEFAULT_RATE
          value: {{ .Values.aiops.sampling.defaultRate | quote }}
        - name: SAMPLING_CRITICAL_RATE
          value: {{ .Values.aiops.sampling.criticalRate | quote }}
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "aiops-agent.fullname" . }}-secret
              key: databaseUrl
              optional: true
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "aiops-agent.fullname" . }}-secret
              key: jwtSecretKey
              optional: true
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: {{ include "aiops-agent.fullname" . }}-secret
              key: redisUrl
              optional: true
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
        {{- if .Values.startupProbe }}
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.startupProbe.failureThreshold }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
