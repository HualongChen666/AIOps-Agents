apiVersion: v2
name: aiops-agent
description: Enterprise-Grade AIOps Platform Helm Chart
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - aiops
  - monitoring
  - anomaly-detection
  - observability
maintainers:
  - name: AIOps Team
    email: aiops@example.com
dependencies:
  - name: postgresql
    version: 12.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: timescaledb-single
    version: 0.8.x
    repository: https://charts.timescale.com
    condition: timescaledb.enabled
  - name: qdrant
    version: 0.7.x
    repository: https://qdrant.github.io/qdrant-helm
    condition: qdrant.enabled
  - name: argo-cd
    version: 5.x.x
    repository: https://argoproj.github.io/argo-helm
    condition: argocd.enabled
