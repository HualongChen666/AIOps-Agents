version: "3.8"

services:
  redis:
    image: redis:7-alpine

  pgbackrest-backup:
    build:
      context: ../..
      dockerfile: services/pgbackrest_backup_service/Dockerfile
    command: [
      "uvicorn",
      "services.pgbackrest_backup_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9544",
    ]
    ports:
      - "9544:9544"
    environment:
      - PGBACKREST_BACKUP_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9644:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - pgbackrest-backup
