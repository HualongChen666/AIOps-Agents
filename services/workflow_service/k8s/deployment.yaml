apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-orchestrator
  labels:
    app: workflow-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workflow-orchestrator
  template:
    metadata:
      labels:
        app: workflow-orchestrator
    spec:
      containers:
        - name: workflow-orchestrator
          image: aiops/workflow-service:latest
          ports:
            - containerPort: 9201
          env:
            - name: WORKFLOW_SERVICE_USE_IN_MEMORY
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-orchestrator
spec:
  selector:
    app: workflow-orchestrator
  ports:
    - port: 9201
      targetPort: 9201
