version: "3.8"

services:
  redis:
    image: redis:7-alpine

  security-scanning:
    build:
      context: ../..
      dockerfile: services/security_scanning_service/Dockerfile
    command: [
      "uvicorn",
      "services.security_scanning_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9563",
    ]
    ports:
      - "9563:9563"
    environment:
      - SECURITY_SCANNING_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9663:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - security-scanning
