apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-integration
  labels:
    app: prometheus-integration
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prometheus-integration
  template:
    metadata:
      labels:
        app: prometheus-integration
    spec:
      containers:
        - name: prometheus-integration
          image: prometheus-integration:latest
          ports:
            - containerPort: 9530
          env:
            - name: PROMETHEUS_INTEGRATION_SERVICE_REDIS_URL
              value: "redis://redis:6379/0"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-integration
spec:
  selector:
    app: prometheus-integration
  ports:
    - port: 9530
      targetPort: 9530
  type: ClusterIP
