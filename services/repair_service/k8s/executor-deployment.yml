apiVersion: apps/v1
kind: Deployment
metadata:
  name: repair-executor
  labels:
    app: repair-executor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: repair-executor
  template:
    metadata:
      labels:
        app: repair-executor
    spec:
      containers:
        - name: repair-executor
          image: aiops/repair-service:latest
          command: ["uvicorn", "services.repair_service.executor:app", "--host", "0.0.0.0", "--port", "9002"]
          ports:
            - containerPort: 9002
          env:
            - name: REPAIR_SERVICE_USE_IN_MEMORY
              value: "true"
            - name: REPAIR_SERVICE_EXECUTOR_PORT
              value: "9002"
---
apiVersion: v1
kind: Service
metadata:
  name: repair-executor
spec:
  selector:
    app: repair-executor
  ports:
    - port: 9002
      targetPort: 9002
