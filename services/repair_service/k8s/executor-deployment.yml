apiVersion: apps/v1
kind: Deployment
metadata:
  name: repair-executor
  labels:
    app: repair-executor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: repair-executor
  template:
    metadata:
      labels:
        app: repair-executor
    spec:
      containers:
        - name: repair-executor
          image: aiops/repair-service:1.0.0
          command: ["uvicorn", "services.repair_service.executor:app", "--host", "0.0.0.0", "--port", "9002"]
          ports:
            - containerPort: 9002
          env:
            - name: REPAIR_SERVICE_USE_IN_MEMORY
              value: "false"
            - name: REPAIR_SERVICE_EXECUTOR_PORT
              value: "9002"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: aiops-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aiops-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: aiops-db-secret
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: aiops-db-secret
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: aiops-db-secret
                  key: POSTGRES_DB
            - name: REPAIR_SERVICE_DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
---
apiVersion: v1
kind: Service
metadata:
  name: repair-executor
spec:
  selector:
    app: repair-executor
  ports:
    - port: 9002
      targetPort: 9002
