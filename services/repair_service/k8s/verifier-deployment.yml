apiVersion: apps/v1
kind: Deployment
metadata:
  name: repair-verifier
  labels:
    app: repair-verifier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: repair-verifier
  template:
    metadata:
      labels:
        app: repair-verifier
    spec:
      containers:
        - name: repair-verifier
          image: aiops/repair-service:latest
          command: ["uvicorn", "services.repair_service.verifier:app", "--host", "0.0.0.0", "--port", "9003"]
          ports:
            - containerPort: 9003
          env:
            - name: REPAIR_SERVICE_USE_IN_MEMORY
              value: "true"
            - name: REPAIR_SERVICE_VERIFIER_PORT
              value: "9003"
---
apiVersion: v1
kind: Service
metadata:
  name: repair-verifier
spec:
  selector:
    app: repair-verifier
  ports:
    - port: 9003
      targetPort: 9003
