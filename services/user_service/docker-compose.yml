version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6384:6379"

  user-orchestrator:
    build:
      context: ../..
      dockerfile: services/user_service/Dockerfile
    command: ["uvicorn", "services.user_service.main_app:app", "--host", "0.0.0.0", "--port", "9401"]
    ports:
      - "9401:9401"
    environment:
      - USER_SERVICE_USE_IN_MEMORY=true
      - USER_SERVICE_ORCHESTRATOR_PORT=9401
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9094:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - user-orchestrator
