apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-orchestrator
  labels:
    app: user-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-orchestrator
  template:
    metadata:
      labels:
        app: user-orchestrator
    spec:
      containers:
        - name: user-orchestrator
          image: aiops/user-service:latest
          ports:
            - containerPort: 9401
          env:
            - name: USER_SERVICE_USE_IN_MEMORY
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: user-orchestrator
spec:
  selector:
    app: user-orchestrator
  ports:
    - port: 9401
      targetPort: 9401
