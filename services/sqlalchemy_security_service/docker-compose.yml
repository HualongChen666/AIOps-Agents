version: "3.8"

services:
  redis:
    image: redis:7-alpine

  sqlalchemy-security:
    build:
      context: ../..
      dockerfile: services/sqlalchemy_security_service/Dockerfile
    command: [
      "uvicorn",
      "services.sqlalchemy_security_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9541",
    ]
    ports:
      - "9541:9541"
    environment:
      - SQLALCHEMY_SECURITY_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9641:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - sqlalchemy-security
