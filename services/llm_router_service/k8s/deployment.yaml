apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-router
  labels:
    app: llm-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-router
  template:
    metadata:
      labels:
        app: llm-router
    spec:
      containers:
        - name: llm-router
          image: llm-router-service:latest
          ports:
            - containerPort: 9405
          env:
            - name: LLM_ROUTER_SERVICE_REDIS_URL
              value: "redis://redis:6379/0"
---
apiVersion: v1
kind: Service
metadata:
  name: llm-router
spec:
  selector:
    app: llm-router
  ports:
    - port: 9405
      targetPort: 9405
