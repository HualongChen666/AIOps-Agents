apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-orchestrator
  labels:
    app: audit-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-orchestrator
  template:
    metadata:
      labels:
        app: audit-orchestrator
    spec:
      containers:
        - name: audit-orchestrator
          image: aiops/audit-service:latest
          ports:
            - containerPort: 9301
          env:
            - name: AUDIT_SERVICE_USE_IN_MEMORY
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: audit-orchestrator
spec:
  selector:
    app: audit-orchestrator
  ports:
    - port: 9301
      targetPort: 9301
