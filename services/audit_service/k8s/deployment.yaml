apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-orchestrator
  labels:
    app: audit-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-orchestrator
  template:
    metadata:
      labels:
        app: audit-orchestrator
    spec:
      containers:
        - name: audit-orchestrator
          image: aiops/audit-service:1.0.0
          ports:
            - containerPort: 9301
          env:
            - name: AUDIT_SERVICE_USE_IN_MEMORY
              value: "false"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: aiops-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aiops-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: aiops-db-secret
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: aiops-db-secret
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: aiops-db-secret
                  key: POSTGRES_DB
            - name: AUDIT_SERVICE_DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
---
apiVersion: v1
kind: Service
metadata:
  name: audit-orchestrator
spec:
  selector:
    app: audit-orchestrator
  ports:
    - port: 9301
      targetPort: 9301
