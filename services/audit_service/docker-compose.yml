version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6383:6379"

  audit-orchestrator:
    build:
      context: ../..
      dockerfile: services/audit_service/Dockerfile
    command: ["uvicorn", "services.audit_service.main_app:app", "--host", "0.0.0.0", "--port", "9301"]
    ports:
      - "9301:9301"
    environment:
      - AUDIT_SERVICE_USE_IN_MEMORY=true
      - AUDIT_SERVICE_ORCHESTRATOR_PORT=9301
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9093:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - audit-orchestrator
