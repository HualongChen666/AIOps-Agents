version: "3.8"

services:

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      - POSTGRES_DB=${POSTGRES_DB:-aiops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6383:6379"

  audit-orchestrator:
    build:
      context: ../..
      dockerfile: services/audit_service/Dockerfile
    command: ["uvicorn", "services.audit_service.main_app:app", "--host", "0.0.0.0", "--port", "9301"]
    ports:
      - "9301:9301"
    environment:
      - AUDIT_SERVICE_USE_IN_MEMORY=false
      - "AUDIT_SERVICE_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-aiops}"
      - AUDIT_SERVICE_ORCHESTRATOR_PORT=9301
    depends_on:
      - redis
      - postgres
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9093:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - audit-orchestrator
