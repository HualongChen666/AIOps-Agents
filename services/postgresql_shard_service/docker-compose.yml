version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "96010:6379"

  postgresql-shard:
    build:
      context: ../..
      dockerfile: services/postgresql_shard_service/Dockerfile
    command:
      [
        "uvicorn",
        "services.postgresql_shard_service.main_app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "9501",
      ]
    ports:
      - "9501:9501"
    environment:
      - POSTGRESQL_SHARD_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9601:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - postgresql-shard
