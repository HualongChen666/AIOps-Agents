apiVersion: apps/v1
kind: Deployment
metadata:
  name: penetration-testing
  labels:
    app: penetration-testing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: penetration-testing
  template:
    metadata:
      labels:
        app: penetration-testing
    spec:
      containers:
        - name: penetration-testing
          image: penetration-testing:latest
          ports:
            - containerPort: 9564
          env:
            - name: PENETRATION_TESTING_SERVICE_REDIS_URL
              value: "redis://redis:6379/0"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: penetration-testing
spec:
  selector:
    app: penetration-testing
  ports:
    - port: 9564
      targetPort: 9564
  type: ClusterIP
