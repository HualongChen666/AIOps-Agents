version: "3.8"

services:
  redis:
    image: redis:7-alpine

  terraform-iac:
    build:
      context: ../..
      dockerfile: services/terraform_iac_service/Dockerfile
    command: [
      "uvicorn",
      "services.terraform_iac_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9536",
    ]
    ports:
      - "9536:9536"
    environment:
      - TERRAFORM_IAC_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9636:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - terraform-iac
