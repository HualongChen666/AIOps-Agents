version: "3.8"

services:
  redis:
    image: redis:7-alpine

  elasticsearch-audit:
    build:
      context: ../..
      dockerfile: services/elasticsearch_audit_service/Dockerfile
    command: [
      "uvicorn",
      "services.elasticsearch_audit_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9542",
    ]
    ports:
      - "9542:9542"
    environment:
      - ELASTICSEARCH_AUDIT_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9642:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - elasticsearch-audit
