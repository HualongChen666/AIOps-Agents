apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenario-memory-service
  labels:
    app: scenario-memory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scenario-memory-service
  template:
    metadata:
      labels:
        app: scenario-memory-service
    spec:
      containers:
        - name: scenario-memory-service
          image: scenario-memory-service:latest
          ports:
            - containerPort: 9408
          env:
            - name: SCENARIO_MEMORY_REDIS_URL
              value: "redis://redis:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: scenario-memory-service
spec:
  selector:
    app: scenario-memory-service
  ports:
    - port: 80
      targetPort: 9408
