version: "3.8"

services:
  redis:
    image: redis:7-alpine

  metrics-monitoring:
    build:
      context: ../..
      dockerfile: services/metrics_monitoring_service/Dockerfile
    command: [
      "uvicorn",
      "services.metrics_monitoring_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9568",
    ]
    ports:
      - "9568:9568"
    environment:
      - METRICS_MONITORING_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9668:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - metrics-monitoring
