version: "3.8"

services:
  redis:
    image: redis:7-alpine

  workflow-engine:
    build:
      context: ../..
      dockerfile: services/workflow_engine_service/Dockerfile
    command: [
      "uvicorn",
      "services.workflow_engine_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9524",
    ]
    ports:
      - "9524:9524"
    environment:
      - WORKFLOW_ENGINE_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9624:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - workflow-engine
