apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugin-orchestrator
  labels:
    app: plugin-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plugin-orchestrator
  template:
    metadata:
      labels:
        app: plugin-orchestrator
    spec:
      containers:
        - name: plugin-orchestrator
          image: aiops/plugin-service:1.0.0
          command: ["uvicorn", "services.plugin_service.main_app:app", "--host", "0.0.0.0", "--port", "9501"]
          ports:
            - containerPort: 9501
          env:
            - name: PLUGIN_SERVICE_USE_IN_MEMORY
              value: "false"
            - name: PLUGIN_SERVICE_ORCHESTRATOR_PORT
              value: "9501"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: aiops-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aiops-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: aiops-db-secret
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: aiops-db-secret
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: aiops-db-secret
                  key: POSTGRES_DB
            - name: PLUGIN_SERVICE_DATABASE_URL
              value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
          readinessProbe:
            httpGet:
              path: /health
              port: 9501
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 9501
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: plugin-orchestrator
spec:
  selector:
    app: plugin-orchestrator
  ports:
    - port: 9501
      targetPort: 9501
  type: ClusterIP
