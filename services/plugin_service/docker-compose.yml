version: "3.8"

services:

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      - POSTGRES_DB=${POSTGRES_DB:-aiops}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6391:6379"

  plugin-orchestrator:
    build:
      context: ../..
      dockerfile: services/plugin_service/Dockerfile
    command: ["uvicorn", "services.plugin_service.main_app:app", "--host", "0.0.0.0", "--port", "9501"]
    ports:
      - "9501:9501"
    environment:
      - PLUGIN_SERVICE_USE_IN_MEMORY=false
      - "PLUGIN_SERVICE_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-aiops}"
      - PLUGIN_SERVICE_ORCHESTRATOR_PORT=9501
    depends_on:
      - redis
      - postgres

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9095:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - plugin-orchestrator

volumes:
  postgres_data:
