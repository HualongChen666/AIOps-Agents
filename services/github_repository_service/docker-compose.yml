version: "3.8"

services:
  redis:
    image: redis:7-alpine

  github-repository:
    build:
      context: ../..
      dockerfile: services/github_repository_service/Dockerfile
    command: [
      "uvicorn",
      "services.github_repository_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9554",
    ]
    ports:
      - "9554:9554"
    environment:
      - GITHUB_REPOSITORY_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9654:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - github-repository
