# Example database secret for the standalone microservices.
#
# The Deployments under services/*/k8s reference this Secret by the name
# `aiops-db-secret` and compose their own driver-specific URL from these keys
# (asyncpg for the async services, psycopg2 for the plugin service).
#
# DO NOT COMMIT REAL VALUES. Create the secret in-cluster instead:
#
#   kubectl create secret generic aiops-db-secret \
#     --from-literal=POSTGRES_USER=postgres \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=POSTGRES_HOST=postgres \
#     --from-literal=POSTGRES_PORT=5432 \
#     --from-literal=POSTGRES_DB=aiops
#
# This file is a template only, so the values are placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: aiops-db-secret
type: Opaque
stringData:
  POSTGRES_USER: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "aiops"
