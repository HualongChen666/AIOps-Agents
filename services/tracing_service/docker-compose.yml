version: "3.8"

services:
  redis:
    image: redis:7-alpine

  tracing:
    build:
      context: ../..
      dockerfile: services/tracing_service/Dockerfile
    command: [
      "uvicorn",
      "services.tracing_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9521",
    ]
    ports:
      - "9521:9521"
    environment:
      - TRACING_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9621:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - tracing
