apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-notifier
  namespace: alert-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alert-notifier
  template:
    metadata:
      labels:
        app: alert-notifier
    spec:
      containers:
        - name: notifier
          image: aiops/alert-service:latest
          ports:
            - containerPort: 8003
          command: ["uvicorn", "services.alert_service.notifier:app", "--host", "0.0.0.0", "--port", "8003"]
          envFrom:
            - configMapRef:
                name: alert-service-config
---
apiVersion: v1
kind: Service
metadata:
  name: alert-notifier
  namespace: alert-service
spec:
  selector:
    app: alert-notifier
  ports:
    - port: 8003
      targetPort: 8003
