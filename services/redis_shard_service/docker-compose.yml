version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "96020:6379"

  redis-shard:
    build:
      context: ../..
      dockerfile: services/redis_shard_service/Dockerfile
    command:
      [
        "uvicorn",
        "services.redis_shard_service.main_app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "9502",
      ]
    ports:
      - "9502:9502"
    environment:
      - REDIS_SHARD_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9602:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - redis-shard
