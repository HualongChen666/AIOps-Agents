apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-recovery-drill
  labels:
    app: backup-recovery-drill
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backup-recovery-drill
  template:
    metadata:
      labels:
        app: backup-recovery-drill
    spec:
      containers:
        - name: backup-recovery-drill
          image: backup-recovery-drill:latest
          ports:
            - containerPort: 9552
          env:
            - name: BACKUP_RECOVERY_DRILL_SERVICE_REDIS_URL
              value: "redis://redis:6379/0"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: backup-recovery-drill
spec:
  selector:
    app: backup-recovery-drill
  ports:
    - port: 9552
      targetPort: 9552
  type: ClusterIP
