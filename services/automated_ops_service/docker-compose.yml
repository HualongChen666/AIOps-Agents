version: "3.8"

services:
  redis:
    image: redis:7-alpine

  automated-ops:
    build:
      context: ../..
      dockerfile: services/automated_ops_service/Dockerfile
    command: [
      "uvicorn",
      "services.automated_ops_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9566",
    ]
    ports:
      - "9566:9566"
    environment:
      - AUTOMATED_OPS_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9666:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - automated-ops
