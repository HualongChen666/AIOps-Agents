version: "3.8"

services:
  redis:
    image: redis:7-alpine

  plugin-market:
    build:
      context: ../..
      dockerfile: services/plugin_market_service/Dockerfile
    command: [
      "uvicorn",
      "services.plugin_market_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9557",
    ]
    ports:
      - "9557:9557"
    environment:
      - PLUGIN_MARKET_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9657:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - plugin-market
