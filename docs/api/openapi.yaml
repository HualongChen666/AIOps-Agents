    "\n    AIOps Agent - 智能运维自动化平台\n\n    ## 功能特性\n    - **AI 根因分析**: 基于自然语言查询的智能故障诊断\n\
    \    - **自动修复**: 支持多平台（Windows/Linux/Docker/K8s）的自动化修复\n    - **指标监控**: 实时系统指标采集与趋势分析\n\
    \    - **日志聚合**: 统一日志采集与搜索（支持 Windows/Linux）\n    - **告警管理**: 智能告警检测与通知（支持企业微信/钉钉/飞书/Slack/Teams）\n\
    \    - **RAG 语义搜索**: 基于向量数据库的历史知识检索\n    - **审计追踪**: 完整的操作审计与报告生成\n\n    ## 认证方式\n\
    \    - JWT Bearer Token 认证\n    - SSO/OIDC 单点登录支持\n\n    ## 联系方式\n    - 文档: /docs\
    \ (Swagger UI)\n    - 备用文档: /redoc (ReDoc)\n    "
