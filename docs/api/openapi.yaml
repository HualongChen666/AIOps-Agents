paths:
  /api/ai/analyze:
    post:
      description:
        "接收自然语言问题,结合当前系统快照 + 富上下文,返回 AI 根因分析结果\n支持 Windows 和 Linux 双平台\n\
        \n\U0001F527 AIR1 [P0]:include_metrics 与 include_rich_context 参数语义独立\n   \
        \ - include_metrics=True:采集简易指标(CPU/MEM/磁盘百分比)\n    - include_rich_context=True:采集富上下文(进程/告警/修复)\n\
        \    - 两者都可独立启用/禁用\n\n\U0001F195 N3-C:优先复用 get_cached_snapshot()(引擎层 1.5s\
        \ TTL 缓存)\n    - 缓存命中时直接返回,避免重复触发 collect_all(~1.1s)\n    - 缓存未命中才触发真实采集\n\
        \n\U0001F527 M-1:可传入 include_rich_context=true 启用富上下文增强(默认开启)\n        富上下文包含:Top\
        \ 5 进程、最近 10 条告警、最近 5 次修复记录、系统统计\n\nReturns:\n    dict: AI analysis result\n\
        \    - analysis: Natural language root cause analysis\n    - confidence: Confidence\
        \ score (0-1)\n    - suggested_actions: List of recommended actions\n    -\
        \ context_used: Context data used for analysis\n    - timestamp: ISO format\
        \ timestamp\n\nExample response:\n    {\n        \"analysis\": \"High CPU\
        \ usage detected in python3 process consuming 85% CPU\",\n        \"confidence\"\
        : 0.92,\n        \"suggested_actions\": [\n            \"Check process logs\
        \ for unusual activity\",\n            \"Consider scaling resources\",\n \
        \           \"Monitor memory usage\"\n        ],\n        \"context_used\"\
        : {\n            \"cpu_usage\": 85.2,\n            \"memory_usage\": 68.3,\n\
        \            \"top_processes\": [\n                {\"name\": \"python3\"\
        , \"cpu\": 85.2, \"memory\": 12.5}\n            ]\n        },\n        \"\
        timestamp\": \"2026-07-02T00:00:00Z\"\n    }\n\nError responses:\n    - 400:\
        \ Invalid request parameters\n    - 500: AI analysis service unavailable\n\
        \    - 503: Service temporarily unavailable"
      operationId: ai_analyze_api_ai_analyze_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                analysis:
                  High CPU usage detected in python3 process consuming 85%
                  CPU
                context_summary:
                  alert_count: 10
                  process_count: 5
                  repair_count: 3
                  rich_enabled: true
                metrics_context: CPU=85.2% | 内存=68.3% | 磁盘=45.0%
                platform: windows
                status: ok
              schema:
                additionalProperties: true
                title: Response Ai Analyze Api Ai Analyze Post
                type: object
          description: AI分析结果
        "400":
          content:
            application/json:
              example:
                error: Invalid request parameters
                error_code: VALIDATION_ERROR
                request_id: uuid
                success: false
                timestamp: "2026-07-04T00:00:00Z"
          description: 请求参数错误
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "500":
          content:
            application/json:
              example:
                error: AI analysis service unavailable
                error_code: AI_ANALYSIS_FAILED
                request_id: uuid
                success: false
                timestamp: "2026-07-04T00:00:00Z"
          description: AI分析服务不可用
        "503":
          content:
            application/json:
              example:
                error: Service temporarily unavailable
                error_code: SERVICE_UNAVAILABLE
                request_id: uuid
                success: false
                timestamp: "2026-07-04T00:00:00Z"
          description: 服务暂时不可用
      summary: AI 根因分析(🔧 M-1 富上下文增强)
      tags:
        - AI分析
      x-codeSamples:
        - label: curl
          lang: Shell
          source:
            "curl -X POST http://localhost:8000/api/ai/analyze -H 'Content-Type:
            application/json' -d '{}'"
        - label: requests
          lang: Python
          source: 'import requests

            resp = requests.post("http://localhost:8000/api/ai/analyze", json={})

            print(resp.json())'
  /api/ai/feedback/recent:
    get:
      description: "返回最近 N 条反馈记录,用于审计 AI 分析质量

        包含 analysis_preview 用于回溯当时的 AI 输出


        🔧 FB2 [P1]:增加 today_only 参数(运维只想看今天的反馈)

        🔧 FB5 [P2]:增加 feedback_type 参数(只看 👎 便于排查 AI 问题)"
      operationId: recent_feedback_api_ai_feedback_recent_get
      parameters:
        - description: 返回的反馈记录数量上限
          in: query
          name: limit
          required: false
          schema:
            default: 20
            description: 返回的反馈记录数量上限
            maximum: 200
            minimum: 1
            title: Limit
            type: integer
        - description: 是否仅返回今日反馈记录(true/false)
          in: query
          name: today_only
          required: false
          schema:
            default: false
            description: 是否仅返回今日反馈记录(true/false)
            title: Today Only
            type: boolean
        - description: 按反馈类型过滤(positive/negative,留空返回全部)
          in: query
          name: feedback_type
          required: false
          schema:
            anyOf:
              - enum:
                  - positive
                  - negative
                type: string
              - type: "null"
            description: 按反馈类型过滤(positive/negative,留空返回全部)
            title: Feedback Type
      responses:
        "200":
          content:
            application/json:
              example:
                filter:
                  today_only: false
                records: []
                total: 10
              schema:
                additionalProperties: true
                title: Response Recent Feedback Api Ai Feedback Recent Get
                type: object
          description: 反馈记录列表
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "500":
          description: 反馈记录查询失败
      summary: 查询最近的反馈记录
      tags:
        - AI反馈闭环
      x-codeSamples:
        - label: curl
          lang: Shell
          source:
            "curl -X GET http://localhost:8000/api/ai/feedback/recent -H 'Content-Type:
            application/json'"
        - label: requests
          lang: Python
          source: 'import requests

            resp = requests.get("http://localhost:8000/api/ai/feedback/recent")

            print(resp.json())'
