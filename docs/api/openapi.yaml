components:
  schemas:
    AdaptiveLearningRequest:
      description: Request for adaptive learning update
      example:
        new_data: {}
      feedback: {}
      learning_mode: example
      properties:
        feedback:
          additionalProperties:
            type: number
          title: Feedback
          type: object
        learning_mode:
          default: online
          title: Learning Mode
          type: string
        new_data:
          additionalProperties: true
          title: New Data
          type: object
      required:
        - new_data
        - feedback
      title: AdaptiveLearningRequest
      type: object
    AnalyzeRequest:
      example:
        include_metrics: true
        include_rich_context: true
        platform: example
        query: example
      properties:
        include_metrics:
          default: true
          description: 是否采集当前系统指标作为分析上下文
          title: Include Metrics
          type: boolean
        include_rich_context:
          default: true
          description: 是否包含富上下文(进程/告警/修复历史),默认开启
          title: Include Rich Context
          type: boolean
        platform:
          default: windows
          description: "目标平台: windows | linux"
          pattern: ^(windows|linux)$
          title: Platform
          type: string
        query:
          description: 自然语言问题描述
          examples:
            - CPU 使用率飙升,请分析根因
          maxLength: 2000
          minLength: 1
          title: Query
          type: string
      required:
        - query
      title: AnalyzeRequest
      type: object
    AnomalyPredictionRequest:
      description: Request for anomaly prediction
      example:
        current_data: {}
      historical_baseline: {}
      properties:
        current_data:
          additionalProperties:
            type: number
          title: Current Data
          type: object
        historical_baseline:
          additionalProperties:
            items:
              type: number
            type: array
          title: Historical Baseline
          type: object
        threshold_std:
          default: 2.0
          title: Threshold Std
          type: number
      required:
        - current_data
        - historical_baseline
      threshold_std: 0.0
      title: AnomalyPredictionRequest
      type: object
    ApproveRequest:
      example:
        approved: true
        comment: example
        repair_id: example
      properties:
        approved:
          title: Approved
          type: boolean
        comment:
          anyOf:
            - type: string
            - type: "null"
          title: Comment
        repair_id:
          title: Repair Id
          type: string
      required:
        - repair_id
        - approved
      title: ApproveRequest
      type: object
    AuditLogRequest:
      description: Request for audit log creation
      example:
        action: example
        data_classification: example
        ip_address: example
        metadata: example
        outcome: example
        resource_id: example
        resource_type: example
        tenant_id: example
        user_agent: example
        user_id: example
      properties:
        action:
          title: Action
          type: string
        data_classification:
          default: internal
          title: Data Classification
          type: string
        ip_address:
          default: unknown
          title: Ip Address
          type: string
        metadata:
          anyOf:
            - additionalProperties: true
              type: object
            - type: "null"
          title: Metadata
        outcome:
          title: Outcome
          type: string
        resource_id:
          title: Resource Id
          type: string
        resource_type:
          title: Resource Type
          type: string
        tenant_id:
          title: Tenant Id
          type: string
        user_agent:
          default: unknown
          title: User Agent
          type: string
        user_id:
          title: User Id
          type: string
      required:
        - tenant_id
        - user_id
        - action
        - resource_type
        - resource_id
        - outcome
      title: AuditLogRequest
      type: object
    AuditLogResponse:
      example:
        action: example
        details: example
        id: 0
        ip_address: example
        resource_id: example
        resource_type: example
        status: example
        username: example
      properties:
        action:
          title: Action
          type: string
        created_at:
          anyOf:
            - format: date-time
              type: string
            - type: "null"
          title: Created At
        details:
          anyOf:
            - type: string
            - type: "null"
          title: Details
        id:
          title: Id
          type: integer
        ip_address:
          anyOf:
            - type: string
            - type: "null"
          title: Ip Address
        resource_id:
          anyOf:
            - type: string
            - type: "null"
          title: Resource Id
        resource_type:
          title: Resource Type
          type: string
        status:
          title: Status
          type: string
        username:
          anyOf:
            - type: string
            - type: "null"
          title: Username
      required:
        - id
        - action
        - resource_type
        - resource_id
        - username
        - ip_address
        - status
        - details
        - created_at
      title: AuditLogResponse
      type: object
    Body_define_plugin_interface_api_plugin_system_interface_define_post:
      properties:
        configuration:
          anyOf:
            - additionalProperties: true
              type: object
            - type: "null"
          title: Configuration
        events:
          additionalProperties: true
          title: Events
          type: object
        methods:
          additionalProperties: true
          title: Methods
          type: object
      required:
        - methods
        - events
      title: Body_define_plugin_interface_api_plugin_system_interface_define_post
      type: object
    CloudRepairRequest:
      description: 云平台修复请求模型
      example:
        action: example
        params: {}
      properties:
        action:
          description: 修复操作名称，如 restart_instance
          maxLength: 64
          minLength: 1
          title: Action
          type: string
        params:
          additionalProperties: true
          description: 修复操作参数
          title: Params
          type: object
      required:
        - action
      title: CloudRepairRequest
      type: object
    CommandCheckRequest:
      description: "🔧 BUG-FIX-7+8(中危):兼容旧字段 + 防止客户端伪造

        🔧 GR5 [P2]:target_host 字符过滤"
      example:
        command: example
        target_host: example
      properties:
        command:
          description: 要检查的命令字符串
          examples:
            - rm -rf /tmp/cache
          maxLength: 2000
          minLength: 1
          title: Command
          type: string
        host:
          default: localhost
          description: 命令将要执行的目标主机(业务字段,非审计字段)
          maxLength: 128
          title: Host
          type: string
      required:
        - command
      title: CommandCheckRequest
      type: object
    CommandRewriteRequest:
      example:
        command: example
      properties:
        command:
          description: 要改写的命令
          examples:
            - rm -rf /tmp/old_data
          maxLength: 2000
          minLength: 1
          title: Command
          type: string
      required:
        - command
      title: CommandRewriteRequest
      type: object
    ComplianceCheckRequest:
      description: Request for compliance check
      example:
        standard: example
      properties:
        standard:
          title: Standard
          type: string
      required:
        - standard
      title: ComplianceCheckRequest
      type: object
    ConfigItemRequest:
      description: 配置项请求
      example:
        key: example
        metadata: example
      properties:
        key:
          title: Key
          type: string
        metadata:
          anyOf:
            - additionalProperties:
                type: string
              type: object
            - type: "null"
          title: Metadata
        value:
          title: Value
      required:
        - key
        - value
      title: ConfigItemRequest
      type: object
    ConfigItemResponse:
      description: 配置项响应
      example:
        key: example
        version: 0
      properties:
        key:
          title: Key
          type: string
        value:
          title: Value
        version:
          title: Version
          type: integer
      required:
        - key
        - value
        - version
      title: ConfigItemResponse
      type: object
    ConsentRequest:
      description: Request for consent management
      example:
        consent_given: true
        consent_purpose: example
        user_id: example
      properties:
        consent_given:
          title: Consent Given
          type: boolean
        consent_purpose:
          title: Consent Purpose
          type: string
        user_id:
          title: User Id
          type: string
      required:
        - user_id
        - consent_given
        - consent_purpose
      title: ConsentRequest
      type: object
    CreateCollectionRequest:
      example:
        distance: example
        name: example
        vector_size: 0
      properties:
        distance:
          default: Cosine
          description: 距离度量：Cosine、Euclid、Dot
          title: Distance
          type: string
        name:
          description: 集合名称（全局唯一）
          title: Name
          type: string
        vector_size:
          description: 向量维度
          exclusiveMinimum: 0.0
          title: Vector Size
          type: integer
      required:
        - name
        - vector_size
      title: CreateCollectionRequest
      type: object
    CustomThemeRequest:
      base_theme: example
      description: Request for creating custom theme
      example:
        colors: {}
        name: example
        theme_id: example
      properties:
        base_theme:
          default: light
          title: Base Theme
          type: string
        colors:
          additionalProperties:
            type: string
          title: Colors
          type: object
        name:
          title: Name
          type: string
        theme_id:
          title: Theme Id
          type: string
      required:
        - theme_id
        - name
        - colors
      title: CustomThemeRequest
      type: object
    DashboardWidgetRequest:
      config: example
      data_source: example
      description: Request for adding dashboard widget
      example:
        dashboard_id: example
        position: {}
        title: example
        widget_id: example
        widget_type: example
      properties:
        config:
          anyOf:
            - additionalProperties: true
              type: object
            - type: "null"
          title: Config
        dashboard_id:
          title: Dashboard Id
          type: string
        data_source:
          anyOf:
            - type: string
            - type: "null"
          title: Data Source
        position:
          additionalProperties:
            type: integer
          title: Position
          type: object
        refresh_interval:
          default: 30
          title: Refresh Interval
          type: integer
        title:
          title: Title
          type: string
        widget_id:
          title: Widget Id
          type: string
        widget_type:
          title: Widget Type
          type: string
      refresh_interval: 0
      required:
        - dashboard_id
        - widget_id
        - widget_type
        - title
        - position
      title: DashboardWidgetRequest
      type: object
    DataFlowStatsResponse:
      description: 数据流统计响应
      example:
        analysis_rate: 0.0
        avg_processing_time_ms: 0.0
        error_rate: 0.0
        total_analyzed: 0
        total_errors: 0
        total_processed: 0
      properties:
        analysis_rate:
          title: Analysis Rate
          type: number
        avg_processing_time_ms:
          title: Avg Processing Time Ms
          type: number
        error_rate:
          title: Error Rate
          type: number
        total_analyzed:
          title: Total Analyzed
          type: integer
        total_errors:
          title: Total Errors
          type: integer
        total_processed:
          title: Total Processed
          type: integer
      required:
        - total_processed
        - total_analyzed
        - total_errors
        - avg_processing_time_ms
        - error_rate
        - analysis_rate
      title: DataFlowStatsResponse
      type: object
    DecisionExplanationRequest:
      decision_type: example
      description: Request for decision explanation
      example:
        decision: example
        decision_context: {}
      properties:
        decision:
          title: Decision
          type: string
        decision_context:
          additionalProperties: true
          title: Decision Context
          type: object
        decision_type:
          default: default
          title: Decision Type
          type: string
      required:
        - decision
        - decision_context
      title: DecisionExplanationRequest
      type: object
    DeletePointsRequest:
      example:
        collection: example
        ids: []
      properties:
        collection:
          description: 目标集合名称
          title: Collection
          type: string
        ids:
          description: 要删除的点的 ID 列表
          items: {}
          title: Ids
          type: array
      required:
        - collection
        - ids
      title: DeletePointsRequest
      type: object
    EncryptionRequest:
      description: Request for data encryption
      example:
        classification: example
        data: example
      properties:
        classification:
          default: internal
          title: Classification
          type: string
        data:
          title: Data
          type: string
      required:
        - data
      title: EncryptionRequest
      type: object
    FeedbackRequest:
      example:
        analysis_text: example
        comment: example
        platform: example
        query_text: example
        rich_context: true
        stage_name: example
      properties:
        analysis_text:
          default: ""
          description: AI 分析结果原文(用于审计回溯)
          maxLength: 5000
          title: Analysis Text
          type: string
        comment:
          default: ""
          description: 用户附加评论(可选)
          maxLength: 500
          title: Comment
          type: string
        feedback_type:
          description: 反馈类型:positive=👍 准确,negative=👎 不准确
          enum:
            - positive
            - negative
          title: Feedback Type
          type: string
        platform:
          default: windows
          description: 目标平台
          pattern: ^(windows|linux)$
          title: Platform
          type: string
        query_text:
          default: ""
          description: 用户原始 query(对齐 ai_engine 上限 2000)
          maxLength: 2000
          title: Query Text
          type: string
        rich_context:
          default: false
          description: AI 分析时是否启用了富上下文(M-1)
          title: Rich Context
          type: boolean
        stage_name:
          default: ""
          description: 流水线阶段名称
          maxLength: 128
          title: Stage Name
          type: string
      required:
        - feedback_type
      title: FeedbackRequest
      type: object
    FlinkJobRequest:
      description: Flink作业请求
      example:
        job_name: example
        job_type: example
        parallelism: 0
      properties:
        job_name:
          title: Job Name
          type: string
        job_type:
          title: Job Type
          type: string
        parallelism:
          default: 2
          title: Parallelism
          type: integer
      required:
        - job_name
        - job_type
      title: FlinkJobRequest
      type: object
    FlinkJobResponse:
      description: Flink作业响应
      example:
        job_name: example
        job_type: example
        status: example
      properties:
        job_name:
          title: Job Name
          type: string
        job_type:
          title: Job Type
          type: string
        status:
          title: Status
          type: string
      required:
        - job_name
        - job_type
        - status
      title: FlinkJobResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: "#/components/schemas/ValidationError"
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthCheckResponse:
      description: 健康检查响应
      example:
        config_center: true
        data_flow: true
        flink: true
        kafka: true
        monitoring: true
        storage: true
      properties:
        config_center:
          title: Config Center
          type: boolean
        data_flow:
          title: Data Flow
          type: boolean
        flink:
          title: Flink
          type: boolean
        kafka:
          title: Kafka
          type: boolean
        monitoring:
          title: Monitoring
          type: boolean
        storage:
          title: Storage
          type: boolean
      required:
        - kafka
        - flink
        - storage
        - config_center
        - monitoring
        - data_flow
      title: HealthCheckResponse
      type: object
    HostHealthRequest:
      example:
        host_id: example
      properties:
        host_id:
          title: Host Id
          type: string
      required:
        - host_id
      title: HostHealthRequest
      type: object
    IntegrationRegistrationRequest:
      description: Request for integration registration
      enabled: true
      example:
        config: {}
        integration_type: example
        name: example
      properties:
        config:
          additionalProperties: true
          title: Config
          type: object
        enabled:
          default: true
          title: Enabled
          type: boolean
        integration_type:
          title: Integration Type
          type: string
        name:
          title: Name
          type: string
      required:
        - integration_type
        - name
        - config
      title: IntegrationRegistrationRequest
      type: object
    JenkinsJobRequest:
      description: Request for Jenkins job trigger
      example:
        integration_id: example
        job_name: example
        parameters: example
      properties:
        integration_id:
          title: Integration Id
          type: string
        job_name:
          title: Job Name
          type: string
        parameters:
          anyOf:
            - additionalProperties: true
              type: object
            - type: "null"
          title: Parameters
      required:
        - integration_id
        - job_name
      title: JenkinsJobRequest
      type: object
    JiraIssueRequest:
      description: Request for Jira issue creation
      example:
        description: example
        integration_id: example
        issue_type: example
        priority: example
        summary: example
      properties:
        description:
          title: Description
          type: string
        integration_id:
          title: Integration Id
          type: string
        issue_type:
          default: Bug
          title: Issue Type
          type: string
        priority:
          default: Medium
          title: Priority
          type: string
        summary:
          title: Summary
          type: string
      required:
        - integration_id
        - summary
        - description
      title: JiraIssueRequest
      type: object
    KafkaMessageRequest:
      description: Kafka消息请求
      example:
        key: example
        topic: example
        value: {}
      headers: example
      properties:
        headers:
          anyOf:
            - additionalProperties:
                type: string
              type: object
            - type: "null"
          title: Headers
        key:
          title: Key
          type: string
        topic:
          title: Topic
          type: string
        value:
          additionalProperties: true
          title: Value
          type: object
      required:
        - topic
        - key
        - value
      title: KafkaMessageRequest
      type: object
    KafkaMessageResponse:
      description: Kafka消息响应
      example:
        message: example
        success: true
      properties:
        message:
          title: Message
          type: string
        success:
          title: Success
          type: boolean
      required:
        - success
        - message
      title: KafkaMessageResponse
      type: object
    KnowledgeLearningRequest:
      description: Request for continuous knowledge learning
      example:
        experience_data: {}
      outcome: example
      properties:
        experience_data:
          additionalProperties: true
          title: Experience Data
          type: object
        outcome:
          title: Outcome
          type: string
      required:
        - experience_data
        - outcome
      title: KnowledgeLearningRequest
      type: object
    LinuxCollectRequest:
      example:
        host_name: example
        metrics: example
      properties:
        host_name:
          description: 目标主机名称或 IP
          maxLength: 128
          minLength: 1
          title: Host Name
          type: string
        metrics:
          anyOf:
            - items:
                type: string
              type: array
            - type: "null"
          description: 要采集的指标列表,None=全量
          title: Metrics
      required:
        - host_name
      title: LinuxCollectRequest
      type: object
    LinuxRepairRequest:
      example:
        host_name: example
        params: {}
        script_key: example
      properties:
        host_name:
          description: 目标主机名称或 IP
          examples:
            - linux-server-01
          maxLength: 128
          minLength: 1
          title: Host Name
          type: string
        params:
          additionalProperties:
            type: string
          description: 脚本参数
          title: Params
          type: object
        script_key:
          description: 修复脚本键名
          examples:
            - clear_tmp
          maxLength: 64
          minLength: 1
          title: Script Key
          type: string
      required:
        - host_name
        - script_key
      title: LinuxRepairRequest
      type: object
    MFAEnableRequest:
      example:
        password: example
      properties:
        password:
          title: Password
          type: string
      required:
        - password
      title: MFAEnableRequest
      type: object
    MetricsRequest:
      example:
        host_id: example
        metrics: []
      properties:
        host_id:
          title: Host Id
          type: string
        metrics:
          items:
            type: string
          title: Metrics
          type: array
      required:
        - host_id
        - metrics
      title: MetricsRequest
      type: object
    MonitoringSummaryResponse:
      description: 监控摘要响应
      example:
        active_alerts: 0
        critical_alerts: 0
        error_alerts: 0
        total_alerts: 0
        total_dashboards: 0
        warning_alerts: 0
      properties:
        active_alerts:
          title: Active Alerts
          type: integer
        critical_alerts:
          title: Critical Alerts
          type: integer
        error_alerts:
          title: Error Alerts
          type: integer
        total_alerts:
          title: Total Alerts
          type: integer
        total_dashboards:
          title: Total Dashboards
          type: integer
        warning_alerts:
          title: Warning Alerts
          type: integer
      required:
        - total_alerts
        - active_alerts
        - critical_alerts
        - error_alerts
        - warning_alerts
        - total_dashboards
      title: MonitoringSummaryResponse
      type: object
    NaturalLanguageRequest:
      description: Request for natural language interaction
      example:
        conversation_id: example
        user_id: example
        user_input: example
      properties:
        conversation_id:
          title: Conversation Id
          type: string
        user_id:
          title: User Id
          type: string
        user_input:
          title: User Input
          type: string
      required:
        - user_input
        - conversation_id
        - user_id
      title: NaturalLanguageRequest
      type: object
    NodeHealthUpdateRequest:
      example:
        node_id: example
      properties:
        node_id:
          description: "节点 ID,例如: agent / detect / rca"
          examples:
            - agent
          maxLength: 64
          minLength: 1
          title: Node Id
          type: string
        status:
          description: "节点健康状态: healthy | warning | critical"
          enum:
            - healthy
            - warning
            - critical
          examples:
            - warning
          title: Status
          type: string
      required:
        - node_id
        - status
      title: NodeHealthUpdateRequest
      type: object
    NotificationRequest:
      description: Request for sending notification
      example:
        body: example
        channel: example
        priority: example
        recipient: example
        subject: example
      properties:
        body:
          title: Body
          type: string
        channel:
          title: Channel
          type: string
        priority:
          default: normal
          title: Priority
          type: string
        recipient:
          title: Recipient
          type: string
        subject:
          title: Subject
          type: string
      required:
        - channel
        - recipient
        - subject
        - body
      title: NotificationRequest
      type: object
    NotifyTestRequest:
      example:
        desc: example
        title: example
      properties:
        desc:
          default: 这是一条测试告警消息
          description: 告警详情描述
          maxLength: 500
          minLength: 1
          title: Desc
          type: string
        level:
          default: critical
          description: "告警级别: info | warning | critical"
          enum:
            - info
            - warning
            - critical
          title: Level
          type: string
        title:
          default: AIOps 测试告警
          description: 告警标题
          maxLength: 100
          minLength: 1
          title: Title
          type: string
      title: NotifyTestRequest
      type: object
    PasswordChange:
      example:
        current_password: example
        new_password: example
      properties:
        current_password:
          title: Current Password
          type: string
        new_password:
          minLength: 12
          title: New Password
          type: string
      required:
        - current_password
        - new_password
      title: PasswordChange
      type: object
    PatternLearningRequest:
      description: Request for pattern learning
      effectiveness: 0.0
      example:
        symptoms: {}
      properties:
        effectiveness:
          title: Effectiveness
          type: number
        resolution_time:
          title: Resolution Time
          type: number
