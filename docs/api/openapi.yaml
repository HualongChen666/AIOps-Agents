        , ...}\n  data: {\"type\": \"workflow_done\",   \"total_ms\": 3200, ...}\n\
        \  data: {\"type\": \"heartbeat\",       \"ts\": \"10:30:00\", ...}      \U0001F527\
        \ WR4\n  data: {\"type\": \"error\",           \"msg\": \"...\", ...}\n\n\U0001F527\
        \ WR1 [P1]:操作人 IP 审计\n\U0001F527 WR5 [P2]:Semaphore 满时立即返回 503,而非等待"
