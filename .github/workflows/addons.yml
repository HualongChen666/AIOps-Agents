name: Add-ons Matrix

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      ENABLE_ADDONS: false
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-mock
          pip install -r requirements.txt || true

      - name: Run core tests
        run: pytest -m core -v --tb=short

  addons-ai-plus:
    runs-on: ubuntu-latest
    env:
      ENABLE_ADDONS: true
      RAG_ENABLED: true
      LLM_ROUTER_ENABLED: true
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-mock
          pip install -r requirements.txt || true

      - name: Run AI Plus add-on tests
        run: pytest -m addons -k ai_plus -v --tb=short || pytest -m addons -v --tb=short
