 - name: Upload collection output
 uses: actions/upload-artifact@v3
 if: always()
 with:
 name: test-collection-output
 path: test-collection-output.txt

 performance:
 runs-on: ubuntu-latest
 
 steps:
 - uses: actions/checkout@v3
 
 - name: Set up Python
 uses: actions/setup-python@v4
 with:
 python-version: '3.12'
 
 - name: Install dependencies
 run: |
 python -m pip install --upgrade pip
 pip install pytest pytest-benchmark
 
 - name: Run performance tests
 run: |
 pytest tests/api/test_metrics_router.py::TestMetricsRouterPerformance -v --benchmark-only
 
 - name: Upload performance results
 uses: actions/upload-artifact@v3
 with:
 name: performance-results
 path: .benchmarks/

 build:
 runs-on: ubuntu-latest
 needs: [test, code-quality, security, test-collection-validation]
 
 steps:
 - uses: actions/checkout@v3
 
 - name: Set up Python
 uses: actions/setup-python@v4
 with:
 python-version: '3.12'
 
 - name: Install build dependencies
 run: |
 python -m pip install --upgrade pip
 pip install build twine
 
 - name: Build package
 run: |
 python -m build
 
 - name: Check package
 run: |
 twine check dist/*
 
 - name: Upload build artifacts
 uses: actions/upload-artifact@v3
 with:
 name: dist
 path: dist/

 deploy:
 runs-on: ubuntu-latest
 needs: [build]
 if: github.ref == 'refs/heads/main' && github.event_name == 'push'
 
 steps:
 - uses: actions/checkout@v3
 
 - name: Download build artifacts
 uses: actions/download-artifact@v3
 with:
 name: dist
 path: dist/
 
 - name: Deploy to production
 run: |
 echo "Deploying to production..."
 # Add your deployment commands here
 # Example: docker build -t aiops-agent .
 # Example: kubectl apply -f k8s/
 
 - name: Notify deployment
 run: |
 echo "Deployment completed successfully"
 # Add notification logic here (Slack, email, etc.)