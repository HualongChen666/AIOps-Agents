name: Quick Tests

on:
 push:
 branches: [ main, develop ]
 pull_request:
 branches: [ main, develop ]

jobs:
 quick-test:
 runs-on: ubuntu-latest
 
 steps:
 - uses: actions/checkout@v3
 
 - name: Set up Python
 uses: actions/setup-python@v4
 with:
 python-version: '3.12'
 
 - name: Install dependencies
 run: |
 python -m pip install --upgrade pip
 pip install pytest pytest-cov pytest-asyncio
 pip install fastapi httpx
 
 - name: Run quick tests
 run: |
 pytest tests/api/test_ai_router.py tests/api/test_alert_router_enhanced.py tests/api/test_health_router.py -v --tb=short
 
 - name: Run integration tests
 run: |
 pytest tests/integration/test_cache_integration_simple.py tests/integration/test_message_queue_integration_simple.py -v --tb=short

 coverage-check:
 runs-on: ubuntu-latest
 
 steps:
 - uses: actions/checkout@v3
 
 - name: Set up Python
 uses: actions/setup-python@v4
 with:
 python-version: '3.12'
 
 - name: Install dependencies
 run: |
 python -m pip install --upgrade pip
 pip install pytest pytest-cov pytest-asyncio
 pip install fastapi httpx
 
 - name: Run tests with coverage
 run: |
 pytest tests/ -v --tb=short --cov=core --cov=api --cov-report=xml --cov-report=term-missing --cov-fail-under=0
 
 - name: Upload coverage to Codecov
 uses: codecov/codecov-action@v3
 with:
 file: ./coverage.xml
 flags: quick-tests
 name: quick-tests-coverage
 fail_ci_if_error: false