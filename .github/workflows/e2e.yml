name: E2E Tests

on:
 push:
 branches: [main, develop]
 pull_request:
 branches: [main, develop]
 workflow_dispatch:

jobs:
 e2e:
 runs-on: ubuntu-latest

 steps:
 - name: Checkout
 uses: actions/checkout@v4

 - name: Set up Python
 uses: actions/setup-python@v5
 with:
 python-version: "3.12"

 - name: Install dependencies
 run: |
 python -m pip install --upgrade pip
 pip install -r requirements.txt
 pip install -r tests/e2e/requirements.txt

 - name: Install Playwright browsers
 run: |
 playwright install chromium
 playwright install-deps chromium

 - name: Start integration services
 run: |
 docker compose -f tests/e2e/docker-compose.test.yml up -d --wait

 - name: Run database migrations
 run: |
 alembic upgrade head
 env:
 DATABASE_URL: postgresql://testuser:testpass@localhost:5432/test_db
 REDIS_URL: redis://localhost:6379/1
 QDRANT_URL: http://localhost:6333

 - name: Start application
 run: |
 nohup uvicorn main:app --host 127.0.0.1 --port 8000 > app.log 2>&1 &
 sleep 10
 curl -f http://127.0.0.1:8000/health || exit 1
 env:
 DATABASE_URL: postgresql://testuser:testpass@localhost:5432/test_db
 REDIS_URL: redis://localhost:6379/1
 QDRANT_URL: http://localhost:6333
 OTEL_COLLECTOR_ENDPOINT: http://localhost:4317

 - name: Run E2E tests
 run: |
 pytest tests/e2e -m e2e --tb=short -v
 env:
 E2E_BASE_URL: http://127.0.0.1:8000
 E2E_DATABASE_URL: postgresql://testuser:testpass@localhost:5432/test_db
 E2E_REDIS_URL: redis://localhost:6379/1
 E2E_QDRANT_URL: http://localhost:6333

 - name: Upload screenshots on failure
 if: failure()
 uses: actions/upload-artifact@v4
 with:
 name: e2e-screenshots
 path: tests/e2e/screenshots/

 - name: Upload application logs
 if: always()
 uses: actions/upload-artifact@v4
 with:
 name: e2e-app-logs
 path: app.log

 - name: Stop services
 if: always()
 run: |
 docker compose -f tests/e2e/docker-compose.test.yml down -v
