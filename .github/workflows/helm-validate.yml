name: Helm Validate

on:
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - '.github/workflows/helm-validate.yml'
  workflow_dispatch:

jobs:
  helm-lint-and-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.4'

      - name: Add Helm repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add timescale https://charts.timescale.com
          helm repo add qdrant https://qdrant.github.io/qdrant-helm
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build helm/aiops-agent

      - name: Helm lint default values
        run: helm lint helm/aiops-agent

      - name: Helm lint prod values
        run: helm lint helm/aiops-agent -f helm/aiops-agent/values-prod.yaml

      - name: Helm lint staging values
        run: helm lint helm/aiops-agent -f helm/aiops-agent/values-staging.yaml

      - name: Helm template prod
        run: helm template aiops-agent helm/aiops-agent -f helm/aiops-agent/values-prod.yaml

      - name: Helm template staging
        run: helm template aiops-agent helm/aiops-agent -f helm/aiops-agent/values-staging.yaml
