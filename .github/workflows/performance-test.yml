name: API Performance Tests

on:
 push:
 branches: [ main, develop ]
 pull_request:
 branches: [ main, develop ]
 schedule:
 # 每天凌晨2点运行性能测试
 - cron: '0 2 * * *'
 workflow_dispatch:
 inputs:
 scenario:
 description: '测试场景'
 required: true
 default: 'staircase'
 type: choice
 options:
 - staircase
 - spike
 - wave
 - constant
 - custom
 users:
 description: '并发用户数'
 required: false
 default: '1000'
 type: string
 duration:
 description: '测试时长(秒)'
 required: false
 default: '300'
 type: string

jobs:
 performance-test:
 runs-on: ubuntu-latest
 
 strategy:
 matrix:
 python-version: ['3.10']
 
 steps:
 - name: Checkout code
 uses: actions/checkout@v3
 
 - name: Set up Python ${{ matrix.python-version }}
 uses: actions/setup-python@v4
 with:
 python-version: ${{ matrix.python-version }}
 
 - name: Install dependencies
 run: |
 python -m pip install --upgrade pip
 pip install locust
 pip install pytest pytest-benchmark
 pip install requests
 
 - name: Start application
 run: |
 # 启动应用（这里需要根据实际启动方式调整）
 # python main.py &
 # sleep 10
 echo "Application started"
 
 - name: Run performance tests (Staircase)
 if: github.event_name == 'schedule' || github.event.inputs.scenario == 'staircase'
 run: |
 cd tests/performance
 locust -f locustfile.py --headless \
 --users 10000 \
 --spawn-rate 100 \
 --run-time 600 \
 --host http://localhost:8000 \
 --shape tests/performance/locust_config.py::StaircaseLoadShape \
 --html reports/staircase_report.html \
 --json reports/staircase_report.json \
 --logfile reports/staircase.log \
 --loglevel INFO
 
 - name: Run performance tests (Spike)
 if: github.event.inputs.scenario == 'spike'
 run: |
 cd tests/performance
 locust -f locustfile.py --headless \
 --users 10000 \
 --spawn-rate 1000 \
 --run-time 300 \
 --host http://localhost:8000 \
 --shape tests/performance/locust_config.py::SpikeLoadShape \
 --html reports/spike_report.html \
 --json reports/spike_report.json \
 --logfile reports/spike.log \
 --loglevel INFO
 
 - name: Run performance tests (Wave)
 if: github.event.inputs.scenario == 'wave'
 run: |
 cd tests/performance
 locust -f locustfile.py --headless \
 --users 5000 \
 --spawn-rate 100 \
 --run-time 300 \
 --host http://localhost:8000 \
 --shape tests/performance/locust_config.py::WaveLoadShape \
 --html reports/wave_report.html \
 --json reports/wave_report.json \
 --logfile reports/wave.log \
 --loglevel INFO
 
 - name: Run performance tests (Constant)
 if: github.event.inputs.scenario == 'constant'
 run: |
 cd tests/performance
 locust -f locustfile.py --headless \
 --users ${{ github.event.inputs.users || '1000' }} \
 --spawn-rate 100 \
 --run-time ${{ github.event.inputs.duration || '300' }} \
 --host http://localhost:8000 \
 --shape tests/performance/locust_config.py::ConstantLoadShape \
 --html reports/constant_report.html \
 --json reports/constant_report.json \
 --logfile reports/constant.log \
 --loglevel INFO
 
 - name: Run performance tests (Custom)
 if: github.event.inputs.scenario == 'custom'
 run: |
 cd tests/performance
 locust -f locustfile.py --headless \
 --users 50000 \
 --spawn-rate 5000 \
 --run-time 780 \
 --host http://localhost:8000 \
 --shape tests/performance/locust_config.py::CustomLoadShape \
 --html reports/custom_report.html \
 --json reports/custom_report.json \
 --logfile reports/custom.log \
 --loglevel INFO
 
 - name: Run quick performance test (PR)
 if: github.event_name == 'pull_request'
 run: |
 cd tests/performance
 locust -f locustfile.py --headless \
 --users 100 \
 --spawn-rate 10 \
 --run-time 60 \
 --host http://localhost:8000 \
 --html reports/quick_report.html \
 --json reports/quick_report.json \
 --logfile reports/quick.log \
 --loglevel INFO
 
 - name: Generate performance report
 if: always()
 run: |
 cd tests/performance
 python -c "
 from report_generator import HTMLReportGenerator, JSONReportGenerator, PerformanceRegressionDetector
 import json
 
 # 读取测试结果
 with open('reports/quick_report.json', 'r') as f:
 data = json.load(f)
 
 # 生成HTML报告
 html_gen = HTMLReportGenerator()
 html_gen.generate(data, {
 'environment': 'CI/CD',
 'scenario': 'quick',
 'users': 100
 })
 
 # 性能回归检测
 detector = PerformanceRegressionDetector()
 regressions = detector.detect_regression(data)
 alert = detector.generate_alert(regressions)
 print(alert)
 
 # 如果有严重回归，退出码为1
 if any(r['severity'] == 'critical' for r in regressions):
 exit(1)
 "
 
 - name: Upload performance reports
 if: always()
 uses: actions/upload-artifact@v3
 with:
 name: performance-reports
 path: tests/performance/reports/
 retention-days: 30
 
 - name: Comment PR with performance results
 if: github.event_name == 'pull_request'
 uses: actions/github-script@v6
 with:
 script: |
 const fs = require('fs');
 const reportPath = 'tests/performance/reports/quick_report.json';
 
 if (fs.existsSync(reportPath)) {
 const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
 const summary = report.summary;
 
 const comment = `## Performance Test Results
 
 - **Total Endpoints**: ${summary.total_endpoints}
 - **Total Requests**: ${summary.total_requests.toLocaleString()}
 - **Success Requests**: ${summary.total_success.toLocaleString()}
 - **Failed Requests**: ${summary.total_failures.toLocaleString()}
 - **Success Rate**: ${((summary.total_success / summary.total_requests) * 100).toFixed(2)}%
 
 [View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
 `;
 
 github.rest.issues.createComment({
 issue_number: context.issue.number,
 owner: context.repo.owner,
 repo: context.repo.repo,
 body: comment
 });
 }
 
 - name: Performance regression alert
 if: failure()
 run: |
 echo "Performance regression detected! Please review the performance report."
 exit 1

 performance-regression-check:
 runs-on: ubuntu-latest
 needs: performance-test
 if: always()
 
 steps:
 - name: Checkout code
 uses: actions/checkout@v3
 
 - name: Download performance reports
 uses: actions/download-artifact@v3
 with:
 name: performance-reports
 path: tests/performance/reports/
 
 - name: Check performance regression
 run: |
 cd tests/performance
 python -c "
 from report_generator import PerformanceRegressionDetector
 import json
 
 # 读取测试结果
 with open('reports/quick_report.json', 'r') as f:
 data = json.load(f)
 
 # 性能回归检测
 detector = PerformanceRegressionDetector()
 regressions = detector.detect_regression(data, threshold=0.1)
 
 if regressions:
 print('Performance Regression Detected!')
 for r in regressions:
 print(f\" - {r['endpoint']}: {r['deviation']:.2%} ({r['severity']})\")
 exit(1)
 else:
 print('No performance regression detected.')
 "
