name: Integration Test Automation

on:
 push:
 branches: [ main, develop ]
 pull_request:
 branches: [ main, develop ]
 schedule:
 - cron: '0 4 * * *' # Daily at 4 AM UTC
 workflow_dispatch: # Manual trigger

env:
 PYTHON_VERSION: '3.12'
 ENVIRONMENT: test
 TESTING: true

jobs:
 # =============================
 # 基础集成测试
 # =============================
 basic-integration-tests:
 name: Basic Integration Tests
 runs-on: ubuntu-latest
 
 steps:
 - name: Checkout code
 uses: actions/checkout@v4
 
 - name: Set up Python
 uses: actions/setup-python@v5
 with:
 python-version: ${{ env.PYTHON_VERSION }}
 
 - name: Cache pip packages
 uses: actions/cache@v4
 with:
 path: ~/.cache/pip
 key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
 restore-keys: |
 ${{ runner.os }}-pip-
 
 - name: Install dependencies
 run: |
 python -m pip install --upgrade pip
 pip install pytest pytest-asyncio pytest-timeout pytest-cov
 pip install httpx sqlalchemy alembic redis python-dotenv
 pip install -r requirements.txt || true
 
 - name: Create test directories
 run: |
 mkdir -p logs reports test_data
 
 - name: Run basic integration tests
 run: |
 pytest tests/integration/ -m "integration and not database and not redis and not api" -v --tb=short --junitxml=test-results.xml
 
 - name: Upload test results
 if: always()
 uses: actions/upload-artifact@v4
 with:
 name: basic-integration-test-results
 path: test-results.xml
 retention-days: 30

 # =============================
 # 数据库集成测试
 # =============================
 database-integration-tests:
 name: Database Integration Tests
 runs-on: ubuntu-latest
 
 services:
 postgres:
 image: postgres:15
 env:
 POSTGRES_USER: testuser
 POSTGRES_PASSWORD: testpass
 POSTGRES_DB: test_db
 options: >-
 --health-cmd pg_isready
 --health-interval 10s
 --health-timeout 5s
 --health-retries 5
 ports:
 - 5432:5432
 
 steps:
 - name: Checkout code
 uses: actions/checkout@v4
 
 - name: Set up Python
 uses: actions/setup-python@v5
 with:
 python-version: ${{ env.PYTHON_VERSION }}
 
 - name: Install dependencies
 run: |
 python -m pip install --upgrade pip
 pip install pytest pytest-asyncio pytest-timeout
 pip install httpx sqlalchemy alembic redis python-dotenv
 pip install psycopg2-binary asyncpg
 pip install -r requirements.txt || true
 
 - name: Create test directories
 run: |
 mkdir -p logs reports test_data
 
 - name: Setup test environment
 run: |
 python tests/integration/setup_integration_test_env.py --setup
 env:
 DATABASE_URL: postgresql://testuser:testpass@localhost:5432/test_db
 REDIS_URL: redis://localhost:6379/1
 
 - name: Run database integration tests
 run: |
 pytest tests/integration/ -m "database" -v --tb=short --junitxml=database-test-results.xml
 env:
 DATABASE_URL: postgresql://testuser:testpass@localhost:5432/test_db
 REDIS_URL: redis://localhost:6379/1
 
 - name: Upload database test results
 if: always()
 uses: actions/upload-artifact@v4
 with:
 name: database-integration-test-results
 path: database-test-results.xml
 retention-days: 30

 # =============================
 # Redis集成测试
 # =============================
 redis-integration-tests:
 name: Redis Integration Tests
 runs-on: ubuntu-latest
 
 services:
 redis:
 image: redis:7
 options: >-
 --health-cmd "redis-cli ping"
 --health-interval 10s
 --health-timeout 5s
 --health-retries 5
 ports:
 - 6379:6379
 
 steps:
 - name: Checkout code
 uses: actions/checkout@v4
 
 - name: Set up Python
 uses: actions/setup-python@v5
 with:
 python-version: ${{ env.PYTHON_VERSION }}
 
 - name: Install dependencies
 run: |
 python -m pip install --upgrade pip
 pip install pytest pytest-asyncio pytest-timeout
 pip install httpx sqlalchemy alembic redis python-dotenv
 pip install -r requirements.txt || true
 
 - name: Create test directories
 run: |
 mkdir -p logs reports test_data
 
 - name: Setup test environment
 run: |
 python tests/integration/setup_integration_test_env.py --setup
 env:
 DATABASE_URL: sqlite:///test.db
 REDIS_URL: redis://localhost:6379/1
 
 - name: Run Redis integration tests
 run: |
 pytest tests/integration/ -m "redis" -v --tb=short --junitxml=redis-test-results.xml
 env:
 DATABASE_URL: sqlite:///test.db
 REDIS_URL: redis://localhost:6379/1
 
 - name: Upload Redis test results
 if: always()
 uses: actions/upload-artifact@v4
 with:
 name: redis-integration-test-results
 path: redis-test-results.xml
 retention-days: 30

 # =============================
 # 完整集成测试
 # =============================
 full-integration-tests:
 name: Full Integration Tests
 runs-on: ubuntu-latest
 
 services:
 postgres:
 image: postgres:15
 env:
 POSTGRES_USER: testuser
 POSTGRES_PASSWORD: testpass
 POSTGRES_DB: test_db
 options: >-
 --health-cmd pg_isready
 --health-interval 10s
 --health-timeout 5s
 --health-retries 5
 ports:
 - 5432:5432
 
 redis:
 image: redis:7
 options: >-
 --health-cmd "redis-cli ping"
 --health-interval 10s
 --health-timeout 5s
 --health-retries 5
 ports:
 - 6379:6379
 
 steps:
 - name: Checkout code
 uses: actions/checkout@v4
 
 - name: Set up Python
 uses: actions/setup-python@v5
 with:
 python-version: ${{ env.PYTHON_VERSION }}
 
 - name: Install dependencies
 run: |
 python -m pip install --upgrade pip
 pip install pytest pytest-asyncio pytest-timeout pytest-cov
 pip install httpx sqlalchemy alembic redis python-dotenv
 pip install psycopg2-binary asyncpg
 pip install -r requirements.txt || true
 
 - name: Create test directories
 run: |
 mkdir -p logs reports test_data
 
 - name: Setup test environment
 run: |
 python tests/integration/setup_integration_test_env.py --setup
 env:
 DATABASE_URL: postgresql://testuser:testpass@localhost:5432/test_db
 REDIS_URL: redis://localhost:6379/1
 
 - name: Run all integration tests
 run: |
 pytest tests/integration/ -m "integration" -v --tb=short --cov=. --cov-report=xml --cov-report=html --junitxml=full-integration-test-results.xml
 env:
 DATABASE_URL: postgresql://testuser:testpass@localhost:5432/test_db
 REDIS_URL: redis://localhost:6379/1
 
 - name: Upload integration test results
 if: always()
 uses: actions/upload-artifact@v4
 with:
 name: full-integration-test-results
 path: full-integration-test-results.xml
 retention-days: 30
 
 - name: Upload coverage reports
 if: always()
 uses: actions/upload-artifact@v4
 with:
 name: integration-coverage-reports
 path: |
 coverage.xml
 htmlcov/
 retention-days: 30
 
 - name: Upload coverage to Codecov
 uses: codecov/codecov-action@v4
 with:
 file: ./coverage.xml
 flags: integration
 name: codecov-integration
 fail_ci_if_error: false

 # =============================
 # 单元测试
 # =============================
 unit-tests:
 name: Unit Tests
 runs-on: ubuntu-latest
 
 strategy:
 matrix:
 python-version: ['3.11', '3.12', '3.14']
 
 steps:
 - name: Checkout code
 uses: actions/checkout@v4
 
 - name: Set up Python ${{ matrix.python-version }}
 uses: actions/setup-python@v5
 with:
 python-version: ${{ matrix.python-version }}
 
 - name: Cache pip packages
 uses: actions/cache@v4
 with:
 path: ~/.cache/pip
 key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
 restore-keys: |
 ${{ runner.os }}-pip-
 
 - name: Install dependencies
 run: |
 python -m pip install --upgrade pip
 pip install pytest pytest-asyncio pytest-cov
 pip install -r requirements.txt || true
 
 - name: Run unit tests
 run: |
 pytest tests/core/ tests/api/ tests/utils/ -v --tb=short --cov=. --cov-report=xml --cov-report=html --junitxml=unit-test-results.xml
 
 - name: Upload unit test results
 if: always()
 uses: actions/upload-artifact@v4
 with:
 name: unit-test-results-${{ matrix.python-version }}
 path: unit-test-results.xml
 retention-days: 30
 
 - name: Upload coverage reports
 if: always()
 uses: actions/upload-artifact@v4
 with:
 name: unit-coverage-reports-${{ matrix.python-version }}
 path: |
 coverage.xml
 htmlcov/
 retention-days: 30
 
 - name: Upload coverage to Codecov
 uses: codecov/codecov-action@v4
 with:
 file: ./coverage.xml
 flags: unit-${{ matrix.python-version }}
 name: codecov-unit-${{ matrix.python-version }}
 fail_ci_if_error: false

 # =============================
 # 测试报告汇总
 # =============================
 test-summary:
 name: Test Summary
 runs-on: ubuntu-latest
 needs: [basic-integration-tests, database-integration-tests, redis-integration-tests, full-integration-tests, unit-tests]
 if: always()
 
 steps:
 - name: Download all test results
 uses: actions/download-artifact@v4
 with:
 path: test-results
 
 - name: Generate test summary
 run: |
 echo "# Test Summary" >> $GITHUB_STEP_SUMMARY
 echo "" >> $GITHUB_STEP_SUMMARY
 echo "## Test Results" >> $GITHUB_STEP_SUMMARY
 echo "" >> $GITHUB_STEP_SUMMARY
 find test-results -name "*.xml" -exec echo "- {}" \; >> $GITHUB_STEP_SUMMARY
 
 - name: Check test results
 run: |
 echo "Checking test results..."
 if [ -d "test-results" ]; then
 echo "Test results found"
 ls -la test-results/
 else
 echo "No test results found"
 fi

 # =============================
 # 安全测试
 # =============================
 security-tests:
 name: Security Tests
 runs-on: ubuntu-latest
 
 steps:
 - name: Checkout code
 uses: actions/checkout@v4
 
 - name: Set up Python
 uses: actions/setup-python@v5
 with:
 python-version: ${{ env.PYTHON_VERSION }}
 
 - name: Install security tools
 run: |
 pip install bandit safety
 pip install -r requirements.txt || true
 
 - name: Run Bandit security linter
 run: |
 bandit -r core/ -f json -o bandit-report.json || true
 bandit -r core/ -f html -o bandit-report.html || true
 
 - name: Run Safety check
 run: |
 safety check --json > safety-report.json || true
 
 - name: Upload security scan results
 if: always()
 uses: actions/upload-artifact@v4
 with:
 name: security-test-results
 path: |
 bandit-report.*
 safety-report.json
 retention-days: 30

 # =============================
 # 代码质量检查
 # =============================
 code-quality-checks:
 name: Code Quality Checks
 runs-on: ubuntu-latest
 
 steps:
 - name: Checkout code
 uses: actions/checkout@v4
 
 - name: Set up Python
 uses: actions/setup-python@v5
 with:
 python-version: ${{ env.PYTHON_VERSION }}
 
 - name: Install linting tools
 run: |
 pip install flake8 black isort mypy pylint
 
 - name: Run Black code formatter check
 run: |
 black --check core/ tests/ || true
 
 - name: Run isort import sorting check
 run: |
 isort --check-only core/ tests/ || true
 
 - name: Run Flake8 linter
 run: |
 flake8 core/ tests/ --max-line-length=100 --extend-ignore=E203,W503 || true
 
 - name: Run MyPy type checker
 run: |
 mypy core/ --ignore-missing-imports || true
 
 - name: Run Pylint
 run: |
 pylint core/ --exit-zero || true
