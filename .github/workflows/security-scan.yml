name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit safety bandit
    
    - name: Run pip-audit
      run: |
        pip-audit --format json --output pip-audit-report.json || true
        pip-audit --format table || true
    
    - name: Run safety scan
      run: |
        safety check --json --output safety-report.json || true
        safety check || true
    
    - name: Run bandit security linter
      run: |
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . || true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          pip-audit-report.json
          safety-report.json
          bandit-report.json
    
    - name: Comment PR with security results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const pipAudit = fs.readFileSync('pip-audit-report.json', 'utf8');
          const safety = fs.readFileSync('safety-report.json', 'utf8');
          const bandit = fs.readFileSync('bandit-report.json', 'utf8');
          
          let comment = '## Security Scan Results\n\n';
          
          if (pipAudit) {
            const pipAuditData = JSON.parse(pipAudit);
            if (pipAuditData.vulnerabilities && pipAuditData.vulnerabilities.length > 0) {
              comment += `### pip-audit: ${pipAuditData.vulnerabilities.length} vulnerabilities found\n\n`;
            } else {
              comment += '### pip-audit: No vulnerabilities found ✅\n\n';
            }
          }
          
          if (safety) {
            comment += '### Safety scan completed\n\n';
          }
          
          if (bandit) {
            const banditData = JSON.parse(bandit);
            if (banditData.results && banditData.results.length > 0) {
              comment += `### Bandit: ${banditData.results.length} issues found\n\n`;
            } else {
              comment += '### Bandit: No issues found ✅\n\n';
            }
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
