name: Coverage Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist pytest-asyncio
          
      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=core --cov=api --cov-report=xml --cov-report=html --cov-report=term-missing --cov-fail-under=40 -c /dev/null
          
      - name: Coverage threshold check
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          coverage = float(tree.find('.coverage').get('line-rate'))
          print(f'Current coverage: {coverage:.2%}')
          assert coverage >= 0.40, f'Coverage {coverage:.2%} below minimum threshold 40%'
          print('✅ Coverage check passed')
          "
          
      - name: Check P0 modules coverage
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          
          # 检查关键模块覆盖率
          p0_modules = {
          'core/alert_engine.py': 0.60,
          'core/repair_engine.py': 0.60,
          'core/authentication.py': 0.60
          }
          
          for module, threshold in p0_modules.items():
          # 查找模块覆盖率
          classes = tree.findall(f".class[@filename='{module}']")
          if classes:
          coverage = float(classes[0].get('line-rate', 0))
          print(f'{module}: {coverage:.2%} (threshold: {threshold:.0%})')
          if coverage < threshold:
          print(f'❌ {module} coverage {coverage:.2%} below threshold {threshold:.0%}')
          else:
          print(f'✅ {module} coverage {coverage:.2%} meets threshold {threshold:.0%}')
          "
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive coverage reports
        uses: actions/upload-artifact@v3
        with:
          name: coverage-reports
          path: |
            htmlcov/
            coverage.xml
            retention-days: 30
            
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
