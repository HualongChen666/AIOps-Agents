name: Build and Deploy

on:
 push:
 branches: [ main ]
 tags:
 - 'v*'
 workflow_dispatch:

jobs:
 build:
 name: Build Docker Image
 runs-on: ubuntu-latest
 
 steps:
 - name: Checkout code
 uses: actions/checkout@v4
 
 - name: Set up Docker Buildx
 uses: docker/setup-buildx-action@v3
 
 - name: Cache Docker layers
 uses: actions/cache@v4
 with:
 path: /tmp/.buildx-cache
 key: ${{ runner.os }}-buildx-${{ github.sha }}
 restore-keys: |
 ${{ runner.os }}-buildx-
 
 - name: Login to Docker Hub
 uses: docker/login-action@v3
 with:
 username: ${{ secrets.DOCKER_USERNAME }}
 password: ${{ secrets.DOCKER_PASSWORD }}
 
 - name: Build and push Docker image
 uses: docker/build-push-action@v5
 with:
 context: .
 push: true
 tags: |
 ${{ secrets.DOCKER_USERNAME }}/aiops-agent:latest
 ${{ secrets.DOCKER_USERNAME }}/aiops-agent:${{ github.sha }}
 ${{ secrets.DOCKER_USERNAME }}/aiops-agent:${{ github.ref_name }}
 cache-from: type=local,src=/tmp/.buildx-cache
 cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
 platforms: linux/amd64,linux/arm64
 
 - name: Move cache
 run: |
 rm -rf /tmp/.buildx-cache
 mv /tmp/.buildx-cache-new /tmp/.buildx-cache

 deploy-helm:
 name: Deploy with Helm
 runs-on: ubuntu-latest
 needs: build
 if: github.ref == 'refs/heads/main'
 
 steps:
 - name: Checkout code
 uses: actions/checkout@v4
 
 - name: Set up Helm
 uses: azure/setup-helm@v4
 with:
 version: 'v3.13.0'
 
 - name: Configure kubectl
 uses: azure/setup-kubectl@v4
 with:
 version: 'v1.28.0'
 
 - name: Configure Kubernetes context
 run: |
 echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
 export KUBECONFIG=kubeconfig
 
 - name: Upgrade Helm release
 run: |
 helm upgrade --install aiops-agent ./helm/aiops-agent \
 --namespace aiops \
 --create-namespace \
 --set image.repository=${{ secrets.DOCKER_USERNAME }}/aiops-agent \
 --set image.tag=${{ github.sha }} \
 --values helm/aiops-agent/values-prod.yaml \
 --wait \
 --timeout 10m
 
 - name: Verify deployment
 run: |
 kubectl rollout status deployment/aiops-agent -n aiops
 kubectl get pods -n aiops

 deploy-staging:
 name: Deploy to Staging
 runs-on: ubuntu-latest
 needs: build
 if: github.ref == 'refs/heads/develop'
 
 steps:
 - name: Checkout code
 uses: actions/checkout@v4
 
 - name: Set up Helm
 uses: azure/setup-helm@v4
 with:
 version: 'v3.13.0'
 
 - name: Configure kubectl
 uses: azure/setup-kubectl@v4
 with:
 version: 'v1.28.0'
 
 - name: Configure Kubernetes context
 run: |
 echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
 export KUBECONFIG=kubeconfig
 
 - name: Upgrade Helm release
 run: |
 helm upgrade --install aiops-agent-staging ./helm/aiops-agent \
 --namespace aiops-staging \
 --create-namespace \
 --set image.repository=${{ secrets.DOCKER_USERNAME }}/aiops-agent \
 --set image.tag=${{ github.sha }} \
 --values helm/aiops-agent/values-staging.yaml \
 --wait \
 --timeout 10m
