name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Install quality tools
        run: |
          pip install black isort flake8 mypy bandit pytest

      - name: Verify OpenAPI snapshot is up to date
        run: |
          python scripts/generate_openapi_snapshot.py --check
          
      - name: Check formatting with black
        run: |
          python -m black --check .
          
      - name: Check import order with isort
        run: |
          python -m isort --check-only .
          
      - name: Lint with flake8
        run: |
          python -m flake8 .
          
      - name: Type check with mypy (baseline gate)
        run: |
          python -m mypy --version
          python scripts/mypy_baseline.py
          
      - name: Security scan with bandit
        run: |
          python -m bandit -c bandit.yaml -r core api services aiops_agent sdk scripts
          
      - name: Run tests with pytest
        run: |
          python -m pytest . -n auto --no-cov --maxfail=3
