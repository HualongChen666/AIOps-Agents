version: "3.8"

services:
  redis:
    image: redis:7-alpine

  sphinx-documentation:
    build:
      context: ../..
      dockerfile: services/sphinx_documentation_service/Dockerfile
    command: [
      "uvicorn",
      "services.sphinx_documentation_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9550",
    ]
    ports:
      - "9550:9550"
    environment:
      - SPHINX_DOCUMENTATION_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9650:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - sphinx-documentation
