version: "3.8"

services:
  redis:
    image: redis:7-alpine

  penetration-testing:
    build:
      context: ../..
      dockerfile: services/penetration_testing_service/Dockerfile
    command: [
      "uvicorn",
      "services.penetration_testing_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9564",
    ]
    ports:
      - "9564:9564"
    environment:
      - PENETRATION_TESTING_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9664:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - penetration-testing
