version: "3.8"

services:
  redis:
    image: redis:7-alpine

  security-audit:
    build:
      context: ../..
      dockerfile: services/security_audit_service/Dockerfile
    command: [
      "uvicorn",
      "services.security_audit_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9551",
    ]
    ports:
      - "9551:9551"
    environment:
      - SECURITY_AUDIT_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9651:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - security-audit
