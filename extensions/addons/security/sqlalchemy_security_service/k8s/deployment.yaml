apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlalchemy-security
  labels:
    app: sqlalchemy-security
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sqlalchemy-security
  template:
    metadata:
      labels:
        app: sqlalchemy-security
    spec:
      containers:
        - name: sqlalchemy-security
          image: sqlalchemy-security:latest
          ports:
            - containerPort: 9541
          env:
            - name: SQLALCHEMY_SECURITY_SERVICE_REDIS_URL
              value: "redis://redis:6379/0"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: sqlalchemy-security
spec:
  selector:
    app: sqlalchemy-security
  ports:
    - port: 9541
      targetPort: 9541
  type: ClusterIP
