apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-standards
  labels:
    app: api-standards
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-standards
  template:
    metadata:
      labels:
        app: api-standards
    spec:
      containers:
        - name: api-standards
          image: api-standards:latest
          ports:
            - containerPort: 9558
          env:
            - name: API_STANDARDS_SERVICE_REDIS_URL
              value: "redis://redis:6379/0"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-standards
spec:
  selector:
    app: api-standards
  ports:
    - port: 9558
      targetPort: 9558
  type: ClusterIP
