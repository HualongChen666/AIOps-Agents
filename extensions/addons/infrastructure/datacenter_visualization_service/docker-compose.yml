version: "3.8"

services:
  redis:
    image: redis:7-alpine

  datacenter-visualization:
    build:
      context: ../..
      dockerfile: services/datacenter_visualization_service/Dockerfile
    command: [
      "uvicorn",
      "services.datacenter_visualization_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9545",
    ]
    ports:
      - "9545:9545"
    environment:
      - DATACENTER_VISUALIZATION_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9645:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - datacenter-visualization
