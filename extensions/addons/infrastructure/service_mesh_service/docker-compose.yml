version: "3.8"

services:
  redis:
    image: redis:7-alpine

  service-mesh:
    build:
      context: ../..
      dockerfile: services/service_mesh_service/Dockerfile
    command: [
      "uvicorn",
      "services.service_mesh_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9520",
    ]
    ports:
      - "9520:9520"
    environment:
      - SERVICE_MESH_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9620:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - service-mesh
