version: "3.8"

services:
  redis:
    image: redis:7-alpine

  performance-monitoring:
    build:
      context: ../..
      dockerfile: services/performance_monitoring_service/Dockerfile
    command: [
      "uvicorn",
      "services.performance_monitoring_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9560",
    ]
    ports:
      - "9560:9560"
    environment:
      - PERFORMANCE_MONITORING_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9660:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - performance-monitoring
