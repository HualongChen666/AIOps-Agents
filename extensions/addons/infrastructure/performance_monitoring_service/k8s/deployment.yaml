apiVersion: apps/v1
kind: Deployment
metadata:
  name: performance-monitoring
  labels:
    app: performance-monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: performance-monitoring
  template:
    metadata:
      labels:
        app: performance-monitoring
    spec:
      containers:
        - name: performance-monitoring
          image: performance-monitoring:latest
          ports:
            - containerPort: 9560
          env:
            - name: PERFORMANCE_MONITORING_SERVICE_REDIS_URL
              value: "redis://redis:6379/0"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: performance-monitoring
spec:
  selector:
    app: performance-monitoring
  ports:
    - port: 9560
      targetPort: 9560
  type: ClusterIP
