version: "3.8"

services:
  redis:
    image: redis:7-alpine

  cloud-monitoring:
    build:
      context: ../..
      dockerfile: services/cloud_monitoring_service/Dockerfile
    command: [
      "uvicorn",
      "services.cloud_monitoring_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9534",
    ]
    ports:
      - "9534:9534"
    environment:
      - CLOUD_MONITORING_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9634:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cloud-monitoring
