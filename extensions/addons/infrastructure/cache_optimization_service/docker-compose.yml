version: "3.8"

services:
  redis:
    image: redis:7-alpine

  cache-optimization:
    build:
      context: ../..
      dockerfile: services/cache_optimization_service/Dockerfile
    command: [
      "uvicorn",
      "services.cache_optimization_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9561",
    ]
    ports:
      - "9561:9561"
    environment:
      - CACHE_OPTIMIZATION_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9661:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cache-optimization
