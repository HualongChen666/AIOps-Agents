version: "3.8"

services:
  redis:
    image: redis:7-alpine

  kubernetes-orchestration:
    build:
      context: ../..
      dockerfile: services/kubernetes_orchestration_service/Dockerfile
    command: [
      "uvicorn",
      "services.kubernetes_orchestration_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9537",
    ]
    ports:
      - "9537:9537"
    environment:
      - KUBERNETES_ORCHESTRATION_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9637:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - kubernetes-orchestration
