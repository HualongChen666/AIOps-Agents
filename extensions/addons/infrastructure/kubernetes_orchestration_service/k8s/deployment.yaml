apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-orchestration
  labels:
    app: kubernetes-orchestration
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubernetes-orchestration
  template:
    metadata:
      labels:
        app: kubernetes-orchestration
    spec:
      containers:
        - name: kubernetes-orchestration
          image: kubernetes-orchestration:latest
          ports:
            - containerPort: 9537
          env:
            - name: KUBERNETES_ORCHESTRATION_SERVICE_REDIS_URL
              value: "redis://redis:6379/0"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-orchestration
spec:
  selector:
    app: kubernetes-orchestration
  ports:
    - port: 9537
      targetPort: 9537
  type: ClusterIP
