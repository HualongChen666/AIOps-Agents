version: "3.8"

services:
  redis:
    image: redis:7-alpine

  fastapi-security:
    build:
      context: ../..
      dockerfile: services/fastapi_security_service/Dockerfile
    command: [
      "uvicorn",
      "services.fastapi_security_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9540",
    ]
    ports:
      - "9540:9540"
    environment:
      - FASTAPI_SECURITY_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9640:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - fastapi-security
