version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "96030:6379"

  qdrant-shard:
    build:
      context: ../..
      dockerfile: services/qdrant_shard_service/Dockerfile
    command:
      [
        "uvicorn",
        "services.qdrant_shard_service.main_app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "9503",
      ]
    ports:
      - "9503:9503"
    environment:
      - QDRANT_SHARD_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9603:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - qdrant-shard
