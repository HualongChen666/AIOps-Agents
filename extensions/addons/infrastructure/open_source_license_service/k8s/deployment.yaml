apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-source-license
  labels:
    app: open-source-license
spec:
  replicas: 2
  selector:
    matchLabels:
      app: open-source-license
  template:
    metadata:
      labels:
        app: open-source-license
    spec:
      containers:
        - name: open-source-license
          image: open-source-license:latest
          ports:
            - containerPort: 9555
          env:
            - name: OPEN_SOURCE_LICENSE_SERVICE_REDIS_URL
              value: "redis://redis:6379/0"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: open-source-license
spec:
  selector:
    app: open-source-license
  ports:
    - port: 9555
      targetPort: 9555
  type: ClusterIP
