version: "3.8"

services:
  redis:
    image: redis:7-alpine

  open-source-license:
    build:
      context: ../..
      dockerfile: services/open_source_license_service/Dockerfile
    command: [
      "uvicorn",
      "services.open_source_license_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9555",
    ]
    ports:
      - "9555:9555"
    environment:
      - OPEN_SOURCE_LICENSE_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9655:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - open-source-license
