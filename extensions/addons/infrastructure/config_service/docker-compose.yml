version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6385:6379"

  config-orchestrator:
    build:
      context: ../..
      dockerfile: services/config_service/Dockerfile
    command: ["uvicorn", "services.config_service.main_app:app", "--host", "0.0.0.0", "--port", "9501"]
    ports:
      - "9501:9501"
    environment:
      - CONFIG_SERVICE_USE_IN_MEMORY=true
      - CONFIG_SERVICE_ORCHESTRATOR_PORT=9501
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9095:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - config-orchestrator
