version: "3.8"

services:
  redis:
    image: redis:7-alpine

  incident-runbook:
    build:
      context: ../..
      dockerfile: services/incident_runbook_service/Dockerfile
    command: [
      "uvicorn",
      "services.incident_runbook_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9547",
    ]
    ports:
      - "9547:9547"
    environment:
      - INCIDENT_RUNBOOK_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9647:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - incident-runbook
