version: "3.8"

services:
  redis:
    image: redis:7-alpine

  incident-response:
    build:
      context: ../..
      dockerfile: services/incident_response_service/Dockerfile
    command: [
      "uvicorn",
      "services.incident_response_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9553",
    ]
    ports:
      - "9553:9553"
    environment:
      - INCIDENT_RESPONSE_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9653:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - incident-response
