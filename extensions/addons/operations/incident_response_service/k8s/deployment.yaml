apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-response
  labels:
    app: incident-response
spec:
  replicas: 2
  selector:
    matchLabels:
      app: incident-response
  template:
    metadata:
      labels:
        app: incident-response
    spec:
      containers:
        - name: incident-response
          image: incident-response:latest
          ports:
            - containerPort: 9553
          env:
            - name: INCIDENT_RESPONSE_SERVICE_REDIS_URL
              value: "redis://redis:6379/0"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: incident-response
spec:
  selector:
    app: incident-response
  ports:
    - port: 9553
      targetPort: 9553
  type: ClusterIP
