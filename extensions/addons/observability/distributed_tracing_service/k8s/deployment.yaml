apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributed-tracing
  labels:
    app: distributed-tracing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: distributed-tracing
  template:
    metadata:
      labels:
        app: distributed-tracing
    spec:
      containers:
        - name: distributed-tracing
          image: distributed-tracing:latest
          ports:
            - containerPort: 9569
          env:
            - name: DISTRIBUTED_TRACING_SERVICE_REDIS_URL
              value: "redis://redis:6379/0"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: distributed-tracing
spec:
  selector:
    app: distributed-tracing
  ports:
    - port: 9569
      targetPort: 9569
  type: ClusterIP
