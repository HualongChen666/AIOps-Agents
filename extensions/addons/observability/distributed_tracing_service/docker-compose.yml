version: "3.8"

services:
  redis:
    image: redis:7-alpine

  distributed-tracing:
    build:
      context: ../..
      dockerfile: services/distributed_tracing_service/Dockerfile
    command: [
      "uvicorn",
      "services.distributed_tracing_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9569",
    ]
    ports:
      - "9569:9569"
    environment:
      - DISTRIBUTED_TRACING_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9669:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - distributed-tracing
