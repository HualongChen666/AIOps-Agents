version: "3.8"

services:
  redis:
    image: redis:7-alpine

  log-aggregation:
    build:
      context: ../..
      dockerfile: services/log_aggregation_service/Dockerfile
    command: [
      "uvicorn",
      "services.log_aggregation_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9567",
    ]
    ports:
      - "9567:9567"
    environment:
      - LOG_AGGREGATION_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9667:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - log-aggregation
