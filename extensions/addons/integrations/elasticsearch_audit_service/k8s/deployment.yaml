apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-audit
  labels:
    app: elasticsearch-audit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: elasticsearch-audit
  template:
    metadata:
      labels:
        app: elasticsearch-audit
    spec:
      containers:
        - name: elasticsearch-audit
          image: elasticsearch-audit:latest
          ports:
            - containerPort: 9542
          env:
            - name: ELASTICSEARCH_AUDIT_SERVICE_REDIS_URL
              value: "redis://redis:6379/0"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-audit
spec:
  selector:
    app: elasticsearch-audit
  ports:
    - port: 9542
      targetPort: 9542
  type: ClusterIP
