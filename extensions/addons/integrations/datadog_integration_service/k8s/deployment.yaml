apiVersion: apps/v1
kind: Deployment
metadata:
  name: datadog-integration
  labels:
    app: datadog-integration
spec:
  replicas: 2
  selector:
    matchLabels:
      app: datadog-integration
  template:
    metadata:
      labels:
        app: datadog-integration
    spec:
      containers:
        - name: datadog-integration
          image: datadog-integration:latest
          ports:
            - containerPort: 9533
          env:
            - name: DATADOG_INTEGRATION_SERVICE_REDIS_URL
              value: "redis://redis:6379/0"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: datadog-integration
spec:
  selector:
    app: datadog-integration
  ports:
    - port: 9533
      targetPort: 9533
  type: ClusterIP
