version: "3.8"

services:
  redis:
    image: redis:7-alpine

  kafka-event:
    build:
      context: ../..
      dockerfile: services/kafka_event_service/Dockerfile
    command: [
      "uvicorn",
      "services.kafka_event_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9525",
    ]
    ports:
      - "9525:9525"
    environment:
      - KAFKA_EVENT_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9625:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - kafka-event
