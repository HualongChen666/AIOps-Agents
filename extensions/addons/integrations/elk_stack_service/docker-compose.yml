version: "3.8"

services:
  redis:
    image: redis:7-alpine

  elk-stack:
    build:
      context: ../..
      dockerfile: services/elk_stack_service/Dockerfile
    command: [
      "uvicorn",
      "services.elk_stack_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9532",
    ]
    ports:
      - "9532:9532"
    environment:
      - ELK_STACK_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9632:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - elk-stack
