version: "3.8"

services:
  redis:
    image: redis:7-alpine

  prometheus-integration:
    build:
      context: ../..
      dockerfile: services/prometheus_integration_service/Dockerfile
    command: [
      "uvicorn",
      "services.prometheus_integration_service.main_app:app",
      "--host", "0.0.0.0",
      "--port", "9530",
    ]
    ports:
      - "9530:9530"
    environment:
      - PROMETHEUS_INTEGRATION_SERVICE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9630:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - prometheus-integration
