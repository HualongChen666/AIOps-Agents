syntax = "proto3";

package release_management;

// Service definition
service ReleaseManagementService {
  // Create a new release
  rpc CreateRelease(CreateReleaseRequest) returns (ReleaseResponse);
  
  // Get release by ID
  rpc GetRelease(GetReleaseRequest) returns (ReleaseResponse);
  
  // List all releases
  rpc ListReleases(ListReleasesRequest) returns (ListReleasesResponse);
  
  // Update release
  rpc UpdateRelease(UpdateReleaseRequest) returns (ReleaseResponse);
  
  // Delete release
  rpc DeleteRelease(DeleteReleaseRequest) returns (DeleteResponse);
  
  // Build release package
  rpc BuildRelease(BuildReleaseRequest) returns (BuildResponse);
  
  // Deploy release
  rpc DeployRelease(DeployReleaseRequest) returns (DeployResponse);
  
  // Rollback release
  rpc RollbackRelease(RollbackReleaseRequest) returns (RollbackResponse);
  
  // Approve release
  rpc ApproveRelease(ApproveReleaseRequest) returns (ApproveResponse);
  
  // Reject release
  rpc RejectRelease(RejectReleaseRequest) returns (RejectResponse);
  
  // Get release history
  rpc GetReleaseHistory(GetHistoryRequest) returns (HistoryResponse);
  
  // Get release status
  rpc GetReleaseStatus(GetStatusRequest) returns (StatusResponse);
  
  // Create version
  rpc CreateVersion(CreateVersionRequest) returns (VersionResponse);
  
  // Get version
  rpc GetVersion(GetVersionRequest) returns (VersionResponse);
  
  // List versions
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
  
  // Increment version
  rpc IncrementVersion(IncrementVersionRequest) returns (VersionResponse);
  
  // Compare versions
  rpc CompareVersions(CompareVersionsRequest) returns (CompareResponse);
}

// Create release
message CreateReleaseRequest {
  string project_name = 1;
  string version = 2;
  string release_type = 3;  // major, minor, patch, hotfix
  string description = 4;
  repeated string changes = 5;
  string environment = 6;  // dev, staging, production
  bool requires_approval = 7;
  repeated string approvers = 8;
}

message ReleaseResponse {
  bool success = 1;
  string message = 2;
  Release release = 3;
}

// Get release
message GetReleaseRequest {
  string release_id = 1;
}

// List releases
message ListReleasesRequest {
  string project_name = 1;
  string environment = 2;
  string status = 3;  // draft, pending, approved, deployed, rolled_back, failed
  int32 limit = 4;
  int32 offset = 5;
}

message ListReleasesResponse {
  bool success = 1;
  string message = 2;
  repeated Release releases = 3;
  int32 total_count = 4;
}

// Update release
message UpdateReleaseRequest {
  string release_id = 1;
  string description = 2;
  repeated string changes = 3;
  string environment = 4;
  repeated string approvers = 5;
}

// Delete release
message DeleteReleaseRequest {
  string release_id = 1;
}

message DeleteResponse {
  bool success = 1;
  string message = 2;
}

// Build release
message BuildReleaseRequest {
  string release_id = 1;
  string build_type = 2;  // docker, package, binary
  map<string, string> build_args = 3;
}

message BuildResponse {
  bool success = 1;
  string message = 2;
  string build_id = 3;
  string build_url = 4;
  int64 build_duration_ms = 5;
  string artifact_path = 6;
}

// Deploy release
message DeployReleaseRequest {
  string release_id = 1;
  string target_environment = 2;
  repeated string target_hosts = 3;
  map<string, string> deployment_config = 4;
  bool rollback_on_failure = 5;
}

message DeployResponse {
  bool success = 1;
  string message = 2;
  string deployment_id = 3;
  repeated DeploymentResult results = 4;
  int64 deployment_duration_ms = 5;
}

// Rollback release
message RollbackReleaseRequest {
  string release_id = 1;
  string rollback_to_version = 2;
  string reason = 3;
  bool force = 4;
}

message RollbackResponse {
  bool success = 1;
  string message = 2;
  string rollback_id = 3;
  string previous_version = 4;
  string current_version = 5;
  int64 rollback_duration_ms = 6;
}

// Approve release
message ApproveReleaseRequest {
  string release_id = 1;
  string approver = 2;
  string comment = 3;
}

message ApproveResponse {
  bool success = 1;
  string message = 2;
  repeated Approval approvals = 3;
}

// Reject release
message RejectReleaseRequest {
  string release_id = 1;
  string rejecter = 2;
  string reason = 3;
}

message RejectResponse {
  bool success = 1;
  string message = 2;
}

// Get history
message GetHistoryRequest {
  string release_id = 1;
  int32 limit = 2;
}

message HistoryResponse {
  bool success = 1;
  string message = 2;
  repeated ReleaseEvent events = 3;
}

// Get status
message GetStatusRequest {
  string release_id = 1;
}

message StatusResponse {
  bool success = 1;
  string message = 2;
  ReleaseStatus status = 3;
}

// Version management
message CreateVersionRequest {
  string project_name = 1;
  string base_version = 2;
  string increment_type = 3;  // major, minor, patch
  string pre_release = 4;  // alpha, beta, rc, etc.
  int32 pre_release_number = 5;
  string build_metadata = 6;
}

message VersionResponse {
  bool success = 1;
  string message = 2;
  Version version = 3;
}

message GetVersionRequest {
  string project_name = 1;
  string version = 2;
}

message ListVersionsRequest {
  string project_name = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListVersionsResponse {
  bool success = 1;
  string message = 2;
  repeated Version versions = 3;
  int32 total_count = 4;
}

message IncrementVersionRequest {
  string project_name = 1;
  string current_version = 2;
  string increment_type = 3;  // major, minor, patch
  string pre_release = 4;
  int32 pre_release_number = 5;
}

message CompareVersionsRequest {
  string version1 = 1;
  string version2 = 2;
}

message CompareResponse {
  bool success = 1;
  string message = 2;
  string comparison_result = 3;  // greater, equal, less
  int32 difference = 4;
}

// Data structures
message Release {
  string id = 1;
  string project_name = 2;
  string version = 3;
  string release_type = 4;
  string description = 5;
  repeated string changes = 6;
  string environment = 7;
  string status = 8;
  bool requires_approval = 9;
  repeated Approval approvals = 10;
  BuildInfo build_info = 11;
  DeploymentInfo deployment_info = 12;
  int64 created_at = 13;
  int64 updated_at = 14;
  string created_by = 15;
  string updated_by = 16;
}

message Version {
  string id = 1;
  string project_name = 2;
  string version = 3;
  int32 major = 4;
  int32 minor = 5;
  int32 patch = 6;
  string pre_release = 7;
  int32 pre_release_number = 8;
  string build_metadata = 9;
  bool is_latest = 10;
  int64 created_at = 11;
}

message Approval {
  string approver = 1;
  string status = 2;  // pending, approved, rejected
  string comment = 3;
  int64 approved_at = 4;
}

message BuildInfo {
  string build_id = 1;
  string build_type = 2;
  string status = 3;  // pending, success, failed
  string artifact_path = 4;
  string build_url = 5;
  int64 started_at = 6;
  int64 completed_at = 7;
  int64 duration_ms = 8;
  map<string, string> build_args = 9;
}

message DeploymentInfo {
  string deployment_id = 1;
  string target_environment = 2;
  repeated string target_hosts = 3;
  string status = 4;  // pending, success, failed, partial
  repeated DeploymentResult results = 5;
  int64 started_at = 6;
  int64 completed_at = 7;
  int64 duration_ms = 8;
  map<string, string> deployment_config = 9;
}

message DeploymentResult {
  string host = 1;
  bool success = 2;
  string message = 3;
  int64 duration_ms = 4;
}

message ReleaseEvent {
  string event_type = 1;  // created, updated, built, deployed, rolled_back, approved, rejected
  string description = 2;
  string performed_by = 3;
  int64 timestamp = 4;
  map<string, string> metadata = 5;
}

message ReleaseStatus {
  string release_id = 1;
  string version = 2;
  string current_status = 3;
  string build_status = 4;
  string deployment_status = 5;
  string approval_status = 6;
  repeated string pending_approvals = 7;
  repeated string completed_approvals = 8;
  float progress_percentage = 9;
  repeated string current_steps = 10;
  repeated string completed_steps = 11;
}
