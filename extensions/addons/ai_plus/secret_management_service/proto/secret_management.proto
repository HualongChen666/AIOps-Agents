syntax = "proto3";

package secret_management;

// Secret Management Service
service SecretManagementService {
  // Create a new secret
  rpc CreateSecret(CreateSecretRequest) returns (SecretResponse);
  
  // Get a secret by ID
  rpc GetSecret(GetSecretRequest) returns (SecretResponse);
  
  // Update a secret
  rpc UpdateSecret(UpdateSecretRequest) returns (SecretResponse);
  
  // Delete a secret
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  
  // List all secrets
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  
  // Rotate a secret
  rpc RotateSecret(RotateSecretRequest) returns (SecretResponse);
  
  // Get secret versions
  rpc GetSecretVersions(GetSecretVersionsRequest) returns (GetSecretVersionsResponse);
  
  // Revert to a specific version
  rpc RevertSecretVersion(RevertSecretVersionRequest) returns (SecretResponse);
  
  // Grant access to a secret
  rpc GrantAccess(GrantAccessRequest) returns (AccessResponse);
  
  // Revoke access to a secret
  rpc RevokeAccess(RevokeAccessRequest) returns (AccessResponse);
  
  // List access permissions
  rpc ListAccess(ListAccessRequest) returns (ListAccessResponse);
  
  // Get audit log
  rpc GetAuditLog(GetAuditLogRequest) returns (GetAuditLogResponse);
  
  // Health check
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// Secret metadata
message SecretMetadata {
  string secret_id = 1;
  string name = 2;
  string description = 3;
  string created_by = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
  int32 version = 7;
  string status = 8;  // active, disabled, expired
  map<string, string> tags = 9;
}

// Secret value (encrypted)
message SecretValue {
  string encrypted_value = 1;
  string encryption_algorithm = 2;
  string key_id = 3;
  int32 version = 4;
  int64 created_at = 5;
}

// Secret with metadata and value
message Secret {
  SecretMetadata metadata = 1;
  SecretValue value = 2;
}

// Create secret request
message CreateSecretRequest {
  string name = 1;
  string value = 2;
  string description = 3;
  string created_by = 4;
  map<string, string> tags = 5;
  string encryption_algorithm = 6;  // AES-256-GCM, etc.
}

// Get secret request
message GetSecretRequest {
  string secret_id = 1;
  bool include_value = 2;
  int32 version = 3;  // if 0, get latest
}

// Update secret request
message UpdateSecretRequest {
  string secret_id = 1;
  string value = 2;
  string description = 3;
  map<string, string> tags = 4;
  string updated_by = 5;
}

// Delete secret request
message DeleteSecretRequest {
  string secret_id = 1;
  bool permanent = 2;  // if false, soft delete
}

// Delete secret response
message DeleteSecretResponse {
  bool success = 1;
  string message = 2;
}

// List secrets request
message ListSecretsRequest {
  string filter_status = 1;  // active, disabled, expired, all
  string filter_tag = 2;
  int32 limit = 3;
  int32 offset = 4;
}

// List secrets response
message ListSecretsResponse {
  repeated SecretMetadata secrets = 1;
  int32 total_count = 2;
}

// Rotate secret request
message RotateSecretRequest {
  string secret_id = 1;
  string new_value = 2;
  string rotated_by = 3;
  int32 old_value_retention_hours = 4;  // how long to keep old value
}

// Get secret versions request
message GetSecretVersionsRequest {
  string secret_id = 1;
}

// Get secret versions response
message GetSecretVersionsResponse {
  repeated SecretValue versions = 1;
  int32 current_version = 2;
}

// Revert secret version request
message RevertSecretVersionRequest {
  string secret_id = 1;
  int32 target_version = 2;
  string reverted_by = 3;
}

// Grant access request
message GrantAccessRequest {
  string secret_id = 1;
  string principal = 2;  // user or service account
  string principal_type = 3;  // user, service, role
  repeated string permissions = 4;  // read, write, delete, rotate
  string granted_by = 5;
}

// Revoke access request
message RevokeAccessRequest {
  string secret_id = 1;
  string principal = 2;
  string revoked_by = 3;
}

// Access response
message AccessResponse {
  bool success = 1;
  string message = 2;
}

// List access request
message ListAccessRequest {
  string secret_id = 1;
}

// Access permission
message AccessPermission {
  string principal = 2;
  string principal_type = 3;
  repeated string permissions = 4;
  int64 granted_at = 5;
  string granted_by = 6;
}

// List access response
message ListAccessResponse {
  repeated AccessPermission permissions = 1;
}

// Audit log entry
message AuditLogEntry {
  string log_id = 1;
  string secret_id = 2;
  string action = 3;  // create, read, update, delete, rotate, grant_access, revoke_access
  string principal = 4;
  string principal_type = 5;
  int64 timestamp = 6;
  string result = 7;  // success, failure
  string details = 8;
  map<string, string> metadata = 9;
}

// Get audit log request
message GetAuditLogRequest {
  string secret_id = 1;
  string action = 2;
  string principal = 3;
  int64 start_time = 4;
  int64 end_time = 5;
  int32 limit = 6;
  int32 offset = 7;
}

// Get audit log response
message GetAuditLogResponse {
  repeated AuditLogEntry entries = 1;
  int32 total_count = 2;
}

// Secret response
message SecretResponse {
  bool success = 1;
  string message = 2;
  Secret secret = 3;
}

// Health check request
message HealthCheckRequest {}

// Health check response
message HealthCheckResponse {
  bool healthy = 1;
  string status = 2;
  string version = 3;
  int64 timestamp = 4;
}
