apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-graph-service
  labels:
    app: knowledge-graph-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-graph-service
  template:
    metadata:
      labels:
        app: knowledge-graph-service
    spec:
      containers:
        - name: knowledge-graph-service
          image: knowledge-graph-service:latest
          ports:
            - containerPort: 9409
          env:
            - name: KNOWLEDGE_GRAPH_REDIS_URL
              value: "redis://redis:6379"
            - name: KNOWLEDGE_GRAPH_NEO4J_URI
              value: "bolt://neo4j:7687"
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-graph-service
spec:
  selector:
    app: knowledge-graph-service
  ports:
    - port: 80
      targetPort: 9409
