# VictoriaMetrics scrape configuration (mounted as `-promscrape.config`).
#
# NOTE: rule evaluation is NOT done by VictoriaMetrics itself — see
# `alert-rules.yml` / `recording-rules.yml` which are loaded by the `vmalert`
# service, and `alertmanager.yml` which vmalert notifies. This file therefore
# only contains `global` + `scrape_configs`.

global:
  scrape_interval: 15s
  external_labels:
    cluster: 'aiops-agent'
    environment: 'production'

scrape_configs:
  # VictoriaMetrics self-monitoring
  - job_name: 'victoriametrics'
    static_configs:
      - targets: ['victoriametrics:8428']
        labels:
          service: 'victoriametrics'
          component: 'observability'

  # AIOps Agent application metrics (default registry, exposed at /metrics)
  - job_name: 'aiops-agent'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['aiops-agent:8000']
        labels:
          service: 'aiops-agent'
          component: 'api'

  # Node exporter for host metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          component: 'infrastructure'
