# VictoriaMetrics alert rules (loaded by the `vmalert` service).
#
# Metric names are the *real* series emitted by the AIOps Agent exporter
# (core/prometheus_metrics.py, exposed at /metrics) plus standard Go process /
# node_exporter metrics — not hypothetical names.

groups:
  - name: victoriametrics_alerts
    interval: 30s
    rules:
      # VictoriaMetrics down
      - alert: VictoriaMetricsDown
        expr: up{job="victoriametrics"} == 0
        for: 1m
        labels:
          severity: critical
          component: victoriametrics
        annotations:
          summary: "VictoriaMetrics instance is down"
          description: "VictoriaMetrics has been down for more than 1 minute."

      # High memory usage
      - alert: VictoriaMetricsHighMemory
        expr: process_resident_memory_bytes{job="victoriametrics"} > 4 * 1024 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
          component: victoriametrics
        annotations:
          summary: "VictoriaMetrics memory usage is high"
          description: "Resident memory is {{ $value | humanize1024 }}B"

      # High CPU usage
      - alert: VictoriaMetricsHighCPU
        expr: rate(process_cpu_seconds_total{job="victoriametrics"}[5m]) > 0.9
        for: 10m
        labels:
          severity: warning
          component: victoriametrics
        annotations:
          summary: "VictoriaMetrics CPU usage is high"
          description: "CPU usage is {{ $value | humanizePercentage }}"

  - name: aiops_application_alerts
    interval: 30s
    rules:
      # AIOps Agent down
      - alert: AIOpsAgentDown
        expr: up{job="aiops-agent"} == 0
        for: 2m
        labels:
          severity: critical
          component: aiops-agent
        annotations:
          summary: "AIOps Agent is down"
          description: "AIOps Agent has been down for more than 2 minutes."

      # API error rate
      - alert: AIOpsAgentHighErrorRate
        expr: sum(rate(aiops_api_errors_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
          component: aiops-agent
        annotations:
          summary: "AIOps Agent high error rate"
          description: "API error rate is {{ $value }} errors/sec"

      # API latency (p95)
      - alert: AIOpsAgentHighLatency
        expr: histogram_quantile(0.95, sum(rate(aiops_api_response_time_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
          component: aiops-agent
        annotations:
          summary: "AIOps Agent high latency"
          description: "95th percentile API latency is {{ $value }}s"

      # AI/LLM latency (p95)
      - alert: AIEngineSlowResponses
        expr: histogram_quantile(0.95, sum(rate(aiops_llm_inference_time_seconds_bucket[5m])) by (le)) > 30
        for: 5m
        labels:
          severity: warning
          component: ai-engine
        annotations:
          summary: "AI engine slow responses"
          description: "95th percentile inference time is {{ $value }}s"

      # Queue backlog
      - alert: AIOpsHighQueueDepth
        expr: sum(aiops_queue_depth) > 1000
        for: 5m
        labels:
          severity: warning
          component: queue
        annotations:
          summary: "AIOps queue backlog is high"
          description: "Total queued messages: {{ $value }}"

  - name: system_alerts
    interval: 30s
    rules:
      # High CPU usage (agent-reported)
      - alert: HighCPUUsage
        expr: aiops_system_cpu_usage_percent > 80
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }}%"

      # High memory usage (agent-reported)
      - alert: HighMemoryUsage
        expr: aiops_system_memory_usage_percent > 80
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }}%"

      # Disk space low
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.2
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "Low disk space"
          description: "Disk space available is {{ $value | humanizePercentage }}"
