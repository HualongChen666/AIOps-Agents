# Alertmanager configuration for VictoriaMetrics/vmalert alerts.
#
# Delivery goes to the AIOps Agent's own alert ingest webhook
# (api/alert_webhook_router.py: POST /api/v1/alerts/webhook/prometheus), which
# closes the observability -> remediation loop without any placeholder
# credentials (no SMTP/PagerDuty/Slack secrets required).

global:
  resolve_timeout: 5m

# Route configuration
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'aiops-webhook'

  routes:
    # Component-specific routes are evaluated FIRST with continue:true so that
    # component receivers fire *and* the severity routing below still applies.
    - match:
        component: victoriametrics
      receiver: 'aiops-webhook'
      continue: true

    - match:
        component: aiops-agent
      receiver: 'aiops-webhook'
      continue: true

    # Critical alerts
    - match:
        severity: critical
      receiver: 'aiops-webhook'
      continue: true

    # Warning alerts
    - match:
        severity: warning
      receiver: 'aiops-webhook'

# Receivers define how alerts are sent
receivers:
  - name: 'aiops-webhook'
    webhook_configs:
      - url: 'http://aiops-agent:8000/api/v1/alerts/webhook/prometheus'
        send_resolved: true

# Inhibition rules prevent alert spam
inhibit_rules:
  # If a critical alert is firing, inhibit warnings for the same service
  - source_match:
      severity: 'critical'
    target_match_re:
      severity: 'warning|info'
    equal: ['service', 'cluster']

  # If VictoriaMetrics is down, inhibit all VictoriaMetrics alerts
  - source_match:
      alertname: 'VictoriaMetricsDown'
    target_match_re:
      component: 'victoriametrics'
    equal: ['cluster']
