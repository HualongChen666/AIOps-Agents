# Self-contained end-to-end add-on compose file.
# Generated by merging docker-compose.e2e.yml and docker-compose.addons.yml.
# No top-level include/extends; compatible with all Docker Compose versions supporting Compose file 3.8.
# Example: docker compose -f docker-compose.addons.e2e.yml --profile ai-plus up --build -d

version: '3.8'
services:
  aiops:
    build: .
    container_name: aiops-e2e
    ports:
    - 8000:8000
    environment:
    - HEAL_EXECUTE_ENABLED=false
    - HEAL_AUTO_APPROVE_SAFE_LOW=true
    - HEAL_DRY_RUN=true
    - HARDWARE_EXECUTE_ENABLED=false
    - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    - DATABASE_URL=${DATABASE_URL:-}
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
    - aiops-network
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: aiops-alertmanager
    ports:
    - 9093:9093
    volumes:
    - ./alertmanager/alertmanager-e2e.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    networks:
    - aiops-network
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: aiops-prometheus
    ports:
    - 9090:9090
    volumes:
    - ./prometheus/prometheus-e2e.yml:/etc/prometheus/prometheus.yml:ro
    - ./prometheus/alerts/aiops-e2e.yml:/etc/prometheus/alerts/aiops.yml:ro
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    depends_on:
    - alertmanager
    - aiops
    networks:
    - aiops-network
  rag-service:
    build:
      context: .
      dockerfile: extensions/addons/ai_plus/rag_service/Dockerfile
    ports:
    - 8001:9406
    environment:
    - PYTHONPATH=/app
    - RAG_ENABLED=true
    networks:
    - aiops-network
    profiles:
    - ai-plus
    - all-addons
