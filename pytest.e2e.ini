[pytest]
# E2E test configuration
testpaths = tests_e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    e2e: End-to-end tests
    slow: Slow running tests
    integration: Integration tests
    core: core functionality, always run
    addons: requires ENABLE_ADDONS=true
addopts =
    -v
    --tb=short
    --strict-markers
    -m e2e