syntax = "proto3";

package identity_management;

// Identity Management Service gRPC Service Definition

// User information
message User {
  int32 id = 1;
  string username = 2;
  string email = 3;
  string full_name = 4;
  string role = 5;
  bool disabled = 6;
  bool mfa_enabled = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
  int64 last_login_at = 10;
  map<string, string> attributes = 11;
}

// User group
message UserGroup {
  int32 id = 1;
  string name = 2;
  string description = 3;
  repeated int32 user_ids = 4;
  map<string, string> attributes = 5;
  int64 created_at = 6;
}

// MFA configuration
message MFAConfig {
  string secret = 1;
  repeated string recovery_codes = 2;
  bool enabled = 3;
}

// SSO configuration
message SSOConfig {
  string provider = 1;
  string client_id = 2;
  map<string, string> metadata = 3;
  bool enabled = 4;
}

// User attribute
message UserAttribute {
  string key = 1;
  string value = 2;
}

// Request messages
message CreateUserRequest {
  string username = 1;
  string password = 2;
  string email = 3;
  string full_name = 4;
  string role = 5;
  repeated UserAttribute attributes = 6;
}

message UpdateUserRequest {
  string username = 1;
  string email = 2;
  string full_name = 3;
  string role = 4;
  bool disabled = 5;
  repeated UserAttribute attributes = 6;
}

message DeleteUserRequest {
  string username = 1;
}

message GetUserRequest {
  string username = 1;
}

message ListUsersRequest {
  int32 limit = 1;
  int32 offset = 2;
  string role = 3;
  bool disabled = 4;
}

message EnableMFARequest {
  string username = 1;
}

message DisableMFARequest {
  string username = 1;
}

message VerifyMFARequest {
  string username = 1;
  string code = 2;
}

message CreateUserGroupRequest {
  string name = 1;
  string description = 2;
  repeated string usernames = 3;
  map<string, string> attributes = 4;
}

message UpdateUserGroupRequest {
  int32 group_id = 1;
  string name = 2;
  string description = 3;
  repeated string usernames = 4;
  map<string, string> attributes = 5;
}

message DeleteUserGroupRequest {
  int32 group_id = 1;
}

message GetUserGroupRequest {
  int32 group_id = 1;
}

message ListUserGroupsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message AddUserToGroupRequest {
  string username = 1;
  int32 group_id = 2;
}

message RemoveUserFromGroupRequest {
  string username = 1;
  int32 group_id = 2;
}

message ConfigureSSORequest {
  string provider = 1;
  string client_id = 2;
  map<string, string> metadata = 3;
}

message SSOLoginRequest {
  string provider = 1;
  string token = 2;
}

message SetUserAttributeRequest {
  string username = 1;
  string key = 2;
  string value = 3;
}

message DeleteUserAttributeRequest {
  string username = 1;
  string key = 2;
}

// Response messages
message UserResponse {
  User user = 1;
  string message = 2;
}

message UsersResponse {
  repeated User users = 1;
  int32 total = 2;
}

message MFAConfigResponse {
  MFAConfig config = 1;
  string message = 2;
}

message MFAVerificationResponse {
  bool verified = 1;
  string message = 2;
}

message UserGroupResponse {
  UserGroup group = 1;
  string message = 2;
}

message UserGroupsResponse {
  repeated UserGroup groups = 1;
  int32 total = 2;
}

message SSOConfigResponse {
  SSOConfig config = 1;
  string message = 2;
}

message SSOLoginResponse {
  bool success = 1;
  User user = 2;
  string token = 3;
  string message = 4;
}

message StatusResponse {
  bool success = 1;
  string message = 2;
}

message Empty {
}

// Identity Management Service
service IdentityManagementService {
  // User lifecycle management
  rpc CreateUser(CreateUserRequest) returns (UserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (StatusResponse);
  rpc GetUser(GetUserRequest) returns (UserResponse);
  rpc ListUsers(ListUsersRequest) returns (UsersResponse);
  
  // User attributes management
  rpc SetUserAttribute(SetUserAttributeRequest) returns (StatusResponse);
  rpc DeleteUserAttribute(DeleteUserAttributeRequest) returns (StatusResponse);
  
  // Multi-factor authentication
  rpc EnableMFA(EnableMFARequest) returns (MFAConfigResponse);
  rpc DisableMFA(DisableMFARequest) returns (StatusResponse);
  rpc VerifyMFA(VerifyMFARequest) returns (MFAVerificationResponse);
  
  // User group management
  rpc CreateUserGroup(CreateUserGroupRequest) returns (UserGroupResponse);
  rpc UpdateUserGroup(UpdateUserGroupRequest) returns (UserGroupResponse);
  rpc DeleteUserGroup(DeleteUserGroupRequest) returns (StatusResponse);
  rpc GetUserGroup(GetUserGroupRequest) returns (UserGroupResponse);
  rpc ListUserGroups(ListUserGroupsRequest) returns (UserGroupsResponse);
  rpc AddUserToGroup(AddUserToGroupRequest) returns (StatusResponse);
  rpc RemoveUserFromGroup(RemoveUserFromGroupRequest) returns (StatusResponse);
  
  // SSO integration
  rpc ConfigureSSO(ConfigureSSORequest) returns (SSOConfigResponse);
  rpc SSOLogin(SSOLoginRequest) returns (SSOLoginResponse);
  
  // Health check
  rpc HealthCheck(Empty) returns (StatusResponse);
}
