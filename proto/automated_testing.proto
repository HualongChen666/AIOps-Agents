syntax = "proto3";

package aiops;

// Automated Testing Service gRPC Service Definition

// Test suite information
message TestSuite {
  string id = 1;
  string name = 2;
  string description = 3;
  string test_path = 4;
  string framework = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  bool active = 8;
}

// Test case information
message TestCase {
  string id = 1;
  string suite_id = 2;
  string name = 3;
  string file_path = 4;
  string class_name = 5;
  string function_name = 6;
  repeated string tags = 7;
  int32 estimated_duration = 8;
}

// Test execution result
message TestResult {
  string id = 1;
  string suite_id = 2;
  string test_case_id = 3;
  string status = 4;  // "passed", "failed", "skipped", "error"
  string message = 5;
  string traceback = 6;
  double duration = 7;
  int64 timestamp = 8;
}

// Test coverage information
message TestCoverage {
  string suite_id = 1;
  int32 lines_covered = 2;
  int32 lines_total = 3;
  double percentage = 4;
  map<string, double> file_coverage = 5;
}

// Test report
message TestReport {
  string id = 1;
  string suite_id = 2;
  int32 total_tests = 3;
  int32 passed = 4;
  int32 failed = 5;
  int32 skipped = 6;
  int32 errors = 7;
  double total_duration = 8;
  int64 started_at = 9;
  int64 completed_at = 10;
  TestCoverage coverage = 11;
  repeated TestResult results = 12;
}

// Test schedule
message TestSchedule {
  string id = 1;
  string suite_id = 2;
  string schedule_type = 3;  // "once", "interval", "cron"
  string schedule_expression = 4;
  int64 next_run = 5;
  bool active = 6;
}

// Request messages
message CreateTestSuiteRequest {
  string name = 1;
  string description = 2;
  string test_path = 3;
  string framework = 4;
}

message GetTestSuiteRequest {
  string id = 1;
}

message ListTestSuitesRequest {
  bool active_only = 1;
}

message UpdateTestSuiteRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  bool active = 4;
}

message DeleteTestSuiteRequest {
  string id = 1;
}

message RunTestsRequest {
  string suite_id = 1;
  repeated string test_ids = 2;
  repeated string tags = 3;
  bool collect_coverage = 4;
}

message GetTestReportRequest {
  string report_id = 1;
  string suite_id = 2;
}

message ListTestReportsRequest {
  string suite_id = 1;
  int32 limit = 2;
}

message CreateScheduleRequest {
  string suite_id = 1;
  string schedule_type = 2;
  string schedule_expression = 3;
}

message GetScheduleRequest {
  string id = 1;
}

message ListSchedulesRequest {
  string suite_id = 1;
  bool active_only = 2;
}

message UpdateScheduleRequest {
  string id = 1;
  bool active = 2;
  string schedule_expression = 3;
}

message DeleteScheduleRequest {
  string id = 1;
}

message GetCoverageRequest {
  string suite_id = 1;
  string report_id = 2;
}

// Response messages
message TestSuiteResponse {
  TestSuite suite = 1;
}

message TestSuitesResponse {
  repeated TestSuite suites = 1;
}

message TestExecutionResponse {
  string execution_id = 1;
  string status = 2;  // "running", "completed", "failed"
  string message = 3;
}

message TestReportResponse {
  TestReport report = 1;
}

message TestReportsResponse {
  repeated TestReport reports = 1;
}

message ScheduleResponse {
  TestSchedule schedule = 1;
}

message SchedulesResponse {
  repeated TestSchedule schedules = 1;
}

message TestCoverageResponse {
  TestCoverage coverage = 1;
}

message Empty {
}

// Automated Testing Service
service AutomatedTestingService {
  // Test suite operations
  rpc CreateTestSuite(CreateTestSuiteRequest) returns (TestSuiteResponse);
  rpc GetTestSuite(GetTestSuiteRequest) returns (TestSuiteResponse);
  rpc ListTestSuites(ListTestSuitesRequest) returns (TestSuitesResponse);
  rpc UpdateTestSuite(UpdateTestSuiteRequest) returns (TestSuiteResponse);
  rpc DeleteTestSuite(DeleteTestSuiteRequest) returns (Empty);
  
  // Test execution operations
  rpc RunTests(RunTestsRequest) returns (TestExecutionResponse);
  rpc GetTestReport(GetTestReportRequest) returns (TestReportResponse);
  rpc ListTestReports(ListTestReportsRequest) returns (TestReportsResponse);
  
  // Schedule operations
  rpc CreateSchedule(CreateScheduleRequest) returns (ScheduleResponse);
  rpc GetSchedule(GetScheduleRequest) returns (ScheduleResponse);
  rpc ListSchedules(ListSchedulesRequest) returns (SchedulesResponse);
  rpc UpdateSchedule(UpdateScheduleRequest) returns (ScheduleResponse);
  rpc DeleteSchedule(DeleteScheduleRequest) returns (Empty);
  
  // Coverage operations
  rpc GetCoverage(GetCoverageRequest) returns (TestCoverageResponse);
}
