global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1m
  receiver: 'aiops-webhook'

receivers:
  - name: 'aiops-webhook'
    webhook_configs:
      - url: 'http://aiops:8000/api/v1/alerts/webhook/prometheus'
        send_resolved: false
