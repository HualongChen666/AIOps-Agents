<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审计中心 | AIOps Agent</title>
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: #1a1f35;
            --bg-card-hover: #242b45;
            --border-color: rgba(255,255,255,0.08);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            height: 48px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }
        .header h1 { font-size: 15px; font-weight: 600; color: var(--accent-cyan); }
        .toolbar {
            padding: 12px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        input, select, button {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
        }
        button { cursor: pointer; transition: all 0.2s; }
        button:hover { background: var(--bg-card-hover); border-color: var(--accent-cyan); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .main { flex: 1; display: flex; overflow: hidden; }
        .content { flex: 1; overflow: auto; padding: 20px; }
        .sidebar { width: 280px; background: var(--bg-secondary); border-left: 1px solid var(--border-color); padding: 20px; overflow-y: auto; flex-shrink: 0; }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .card h3 { font-size: 14px; margin-bottom: 12px; color: var(--accent-cyan); }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat { background: var(--bg-secondary); padding: 10px; border-radius: 6px; }
        .stat .label { font-size: 11px; color: var(--text-muted); }
        .stat .value { font-size: 18px; font-weight: 700; margin-top: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { padding: 10px; border-bottom: 1px solid var(--border-color); text-align: left; }
        th { color: var(--text-muted); font-weight: 600; background: var(--bg-secondary); }
        td { color: var(--text-secondary); }
        tr:hover td { background: rgba(255,255,255,0.03); }
        .message { color: var(--text-muted); font-size: 13px; padding: 20px; text-align: center; }
        .error { color: var(--accent-red); font-size: 13px; padding: 10px; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; margin-right: 4px; }
        .badge.high { background: rgba(239,68,68,0.15); color: var(--accent-red); }
        .badge.medium { background: rgba(245,158,11,0.15); color: var(--accent-yellow); }
        .badge.low { background: rgba(59,130,246,0.15); color: var(--accent-blue); }
        .badge.safe { background: rgba(16,185,129,0.15); color: var(--accent-green); }
    </style>
</head>
<body>
    <div class="header">
        <h1>审计中心</h1>
        <div style="font-size:12px;color:var(--text-muted);" id="status">准备加载</div>
    </div>
    <div class="toolbar">
        <input type="text" id="keyInput" placeholder="X-Internal-Key" style="min-width:220px;">
        <select id="limitSelect">
            <option value="20">20 条</option>
            <option value="50">50 条</option>
            <option value="100" selected>100 条</option>
            <option value="500">500 条</option>
        </select>
        <button id="loadBtn">加载数据</button>
        <button id="exportCsvBtn">导出 CSV</button>
        <button id="exportExcelBtn">导出 Excel</button>
    </div>
    <div class="main">
        <div class="content">
            <div id="message" class="message">请输入 X-Internal-Key 并点击加载</div>
            <div id="tableWrap" style="display:none;">
                <table id="auditTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
        <div class="sidebar">
            <div class="card">
                <h3>审计统计</h3>
                <div class="stat-grid">
                    <div class="stat"><div class="label">总数</div><div class="value" id="totalStat">-</div></div>
                    <div class="stat"><div class="label">风险样本</div><div class="value" id="sampleStat">-</div></div>
                </div>
            </div>
            <div class="card">
                <h3>风险分布</h3>
                <div id="riskDist" class="message" style="padding:0;text-align:left;">-</div>
            </div>
            <div class="card">
                <h3>结果分布</h3>
                <div id="resultDist" class="message" style="padding:0;text-align:left;">-</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const keyInput = document.getElementById('keyInput');
            const limitSelect = document.getElementById('limitSelect');
            const loadBtn = document.getElementById('loadBtn');
            const exportCsvBtn = document.getElementById('exportCsvBtn');
            const exportExcelBtn = document.getElementById('exportExcelBtn');
            const statusEl = document.getElementById('status');
            const messageEl = document.getElementById('message');
            const tableWrap = document.getElementById('tableWrap');
            const tableHead = document.getElementById('tableHead');
            const tableBody = document.getElementById('tableBody');
            const totalStat = document.getElementById('totalStat');
            const sampleStat = document.getElementById('sampleStat');
            const riskDist = document.getElementById('riskDist');
            const resultDist = document.getElementById('resultDist');

            const STORAGE_KEY = 'aiops-internal-key';
            keyInput.value = localStorage.getItem(STORAGE_KEY) || '';

            function getHeaders() {
                const key = keyInput.value.trim();
                const h = { 'Accept': 'application/json' };
                if (key) h['X-Internal-Key'] = key;
                return h;
            }

            function saveKey() { localStorage.setItem(STORAGE_KEY, keyInput.value.trim()); }

            function renderBadges(obj, container) {
                container.innerHTML = '';
                if (!obj || typeof obj !== 'object') {
                    container.textContent = '无数据';
                    return;
                }
                Object.keys(obj).forEach(k => {
                    const v = obj[k];
                    const span = document.createElement('span');
                    span.className = 'badge ' + k;
                    span.textContent = k + ': ' + v;
                    container.appendChild(span);
                });
            }

            function renderTable(logs) {
                if (!Array.isArray(logs) || logs.length === 0) {
                    messageEl.textContent = '暂无审计日志数据';
                    messageEl.style.display = 'block';
                    tableWrap.style.display = 'none';
                    return;
                }
                messageEl.style.display = 'none';
                tableWrap.style.display = 'block';

                const keys = Object.keys(logs[0]);
                tableHead.innerHTML = '<tr>' + keys.map(k => '<th>' + k + '</th>').join('') + '</tr>';
                tableBody.innerHTML = logs.map(row => {
                    return '<tr>' + keys.map(k => {
                        const v = row[k];
                        let cell = v == null ? '' : (typeof v === 'object' ? JSON.stringify(v) : v);
                        return '<td>' + cell + '</td>';
                    }).join('') + '</tr>';
                }).join('');
            }

            function loadData() {
                saveKey();
                const limit = limitSelect.value;
                statusEl.textContent = '加载中...';
                Promise.all([
                    fetch('/api/v1/audit?limit=' + limit, { headers: getHeaders() }),
                    fetch('/api/v1/audit/report', { headers: getHeaders() })
                ])
                .then(responses => {
                    const [listResp, reportResp] = responses;
                    if (!listResp.ok) throw new Error('审计日志接口 ' + listResp.status);
                    if (!reportResp.ok) throw new Error('审计报告接口 ' + reportResp.status);
                    return Promise.all([listResp.json(), reportResp.json()]);
                })
                .then(([logs, report]) => {
                    renderTable(logs);
                    totalStat.textContent = report.total != null ? report.total : '-';
                    sampleStat.textContent = Array.isArray(report.sample) ? report.sample.length : '-';
                    renderBadges(report.risk_distribution, riskDist);
                    renderBadges(report.result_distribution, resultDist);
                    statusEl.textContent = '加载完成';
                })
                .catch(err => {
                    statusEl.textContent = '加载失败';
                    messageEl.textContent = '错误：' + err.message;
                    messageEl.style.display = 'block';
                    tableWrap.style.display = 'none';
                    console.error(err);
                });
            }

            function exportFile(fmt) {
                saveKey();
                const limit = limitSelect.value;
                const url = '/api/v1/audit/export?fmt=' + fmt + '&limit=' + limit;
                fetch(url, { headers: getHeaders() })
                    .then(r => {
                        if (!r.ok) throw new Error('导出失败 ' + r.status);
                        return r.blob();
                    })
                    .then(blob => {
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = 'audit_export_' + fmt + '_' + new Date().toISOString().slice(0,10) + (fmt === 'csv' ? '.csv' : '.xlsx');
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                    })
                    .catch(err => { statusEl.textContent = '导出失败'; alert(err.message); });
            }

            loadBtn.addEventListener('click', loadData);
            exportCsvBtn.addEventListener('click', () => exportFile('csv'));
            exportExcelBtn.addEventListener('click', () => exportFile('excel'));

            if (keyInput.value) loadData();
        })();
    </script>
</body>
</html>
