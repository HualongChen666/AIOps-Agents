<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HITL 审批中心 | AIOps Agent</title>
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: #1a1f35;
            --bg-card-hover: #242b45;
            --border-color: rgba(255,255,255,0.08);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            height: 48px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }
        .header h1 { font-size: 15px; font-weight: 600; color: var(--accent-cyan); }
        .header .status { font-size: 12px; color: var(--text-muted); }
        .main { flex: 1; display: flex; overflow: hidden; }
        .sidebar { width: 360px; background: var(--bg-secondary); border-right: 1px solid var(--border-color); padding: 16px; overflow-y: auto; flex-shrink: 0; }
        .content { flex: 1; overflow: auto; padding: 20px; }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .card h3 { font-size: 13px; margin-bottom: 10px; color: var(--accent-cyan); }
        label { display: block; font-size: 12px; color: var(--text-secondary); margin: 8px 0 4px; }
        input, textarea, select {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
        }
        textarea { resize: vertical; min-height: 60px; }
        button {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 10px;
            transition: all 0.2s;
        }
        button:hover { background: var(--bg-card-hover); border-color: var(--accent-cyan); }
        button.primary { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
        button.primary:hover { background: #2563eb; }
        button.danger { background: var(--accent-red); border-color: var(--accent-red); color: #fff; }
        button.danger:hover { background: #dc2626; }
        button.success { background: var(--accent-green); border-color: var(--accent-green); color: #fff; }
        button.success:hover { background: #059669; }
        .result {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            font-size: 13px;
            white-space: pre-wrap;
            color: var(--text-secondary);
            min-height: 120px;
        }
        .error { color: var(--accent-red); }
        .success { color: var(--accent-green); }
        .form-row { display: flex; gap: 8px; }
        .form-row > * { flex: 1; }
    </style>
</head>
<body>
    <div class="header">
        <h1>HITL 审批中心</h1>
        <div class="status" id="healthStatus">检查中...</div>
    </div>
    <div class="main">
        <div class="sidebar">
            <div class="card">
                <h3>创建审批请求</h3>
                <label>标题</label>
                <input type="text" id="createTitle" placeholder="修复方案审批">
                <label>工作流 ID</label>
                <input type="text" id="createWorkflow" placeholder="default">
                <label>审批步骤 (JSON 数组)</label>
                <textarea id="createSteps" placeholder='[{"step_id":"step-1","name":"管理员审批","approver":"admin"}]'></textarea>
                <button class="primary" id="createBtn">创建请求</button>
            </div>
            <div class="card">
                <h3>查询 / 操作</h3>
                <label>请求 ID</label>
                <input type="text" id="requestId" placeholder="req-xxx">
                <button id="statusBtn">查询状态</button>
                <label>步骤 ID</label>
                <input type="text" id="stepId" placeholder="step-1">
                <label>审批人</label>
                <input type="text" id="approver" placeholder="admin">
                <label>备注 (可选)</label>
                <input type="text" id="comment">
                <div class="form-row">
                    <button class="success" id="approveBtn">批准</button>
                    <button class="danger" id="rejectBtn">拒绝</button>
                </div>
                <button id="takeoverBtn" style="margin-top:8px;">人工接管</button>
            </div>
        </div>
        <div class="content">
            <div id="result" class="result">在左侧创建或查询审批请求</div>
        </div>
    </div>

    <script>
        (function() {
            const healthEl = document.getElementById('healthStatus');
            const resultEl = document.getElementById('result');

            function checkHealth() {
                fetch('/hitl/health')
                    .then(r => r.json())
                    .then(data => {
                        const ok = data.hitl_available;
                        healthEl.textContent = (data.status || 'unknown') + (ok ? ' (可用)' : ' (不可用)');
                        healthEl.style.color = ok ? 'var(--accent-green)' : 'var(--accent-red)';
                    })
                    .catch(err => {
                        healthEl.textContent = '健康检查失败';
                        healthEl.style.color = 'var(--accent-red)';
                    });
            }

            function show(obj, ok) {
                resultEl.textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
                resultEl.className = 'result ' + (ok ? 'success' : 'error');
            }

            function jsonInput(id) {
                try { return JSON.parse(document.getElementById(id).value.trim()); }
                catch (e) { throw new Error('JSON 解析失败: ' + e.message); }
            }

            function postJson(url, body) {
                return fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(body)
                }).then(r => r.json().then(data => ({ ok: r.ok, status: r.status, data })));
            }

            function postForm(url) {
                return fetch(url, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json' }
                }).then(r => r.json().then(data => ({ ok: r.ok, status: r.status, data })));
            }

            function queryParam(name) { return encodeURIComponent(document.getElementById(name).value.trim()); }

            document.getElementById('createBtn').addEventListener('click', function() {
                const title = document.getElementById('createTitle').value.trim() || '审批请求';
                const workflow_id = document.getElementById('createWorkflow').value.trim() || 'default';
                let steps = [];
                try { steps = jsonInput('createSteps'); } catch (e) { show(e.message, false); return; }
                postJson('/hitl/approval/request', { title, workflow_id, steps, description: '', context: {} })
                    .then(({ ok, data }) => show(data, ok))
                    .catch(err => show('请求失败: ' + err.message, false));
            });

            document.getElementById('statusBtn').addEventListener('click', function() {
                const rid = queryParam('requestId');
                if (!rid) { show('请输入请求 ID', false); return; }
                fetch('/hitl/approval/' + rid)
                    .then(r => r.json().then(data => ({ ok: r.ok, data })))
                    .then(({ ok, data }) => show(data, ok))
                    .catch(err => show('查询失败: ' + err.message, false));
            });

            document.getElementById('approveBtn').addEventListener('click', function() {
                const rid = queryParam('requestId');
                const sid = queryParam('stepId');
                const appr = queryParam('approver');
                const comm = queryParam('comment');
                if (!rid || !sid || !appr) { show('请输入请求 ID、步骤 ID、审批人', false); return; }
                const url = '/hitl/approval/approve?request_id=' + rid + '&step_id=' + sid + '&approver=' + appr + (comm ? '&comment=' + comm : '');
                postForm(url).then(({ ok, data }) => show(data, ok)).catch(err => show('批准失败: ' + err.message, false));
            });

            document.getElementById('rejectBtn').addEventListener('click', function() {
                const rid = queryParam('requestId');
                const sid = queryParam('stepId');
                const appr = queryParam('approver');
                const comm = queryParam('comment');
                if (!rid || !sid || !appr) { show('请输入请求 ID、步骤 ID、审批人', false); return; }
                const url = '/hitl/approval/reject?request_id=' + rid + '&step_id=' + sid + '&approver=' + appr + (comm ? '&comment=' + comm : '');
                postForm(url).then(({ ok, data }) => show(data, ok)).catch(err => show('拒绝失败: ' + err.message, false));
            });

            document.getElementById('takeoverBtn').addEventListener('click', function() {
                const rid = queryParam('requestId');
                if (!rid) { show('请输入请求 ID', false); return; }
                const url = '/hitl/takeover/' + rid + '?reason=manual';
                postForm(url).then(({ ok, data }) => show(data, ok)).catch(err => show('接管失败: ' + err.message, false));
            });

            checkHealth();
        })();
    </script>
</body>
</html>
