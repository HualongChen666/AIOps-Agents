# KPI and SLO Configuration
# =========================
# This configuration defines Key Performance Indicators (KPIs) and
# Service Level Objectives (SLOs) for the AIOps SRE Agent system.

kpi:
  # API Response Time KPIs
  api_response_time:
    name: "API Response Time"
    description: "API endpoint response time metrics"
    enabled: true
    unit: "milliseconds"
    percentiles:
      p50:
        target: 100.0
        warning: 150.0
        critical: 300.0
      p95:
        target: 200.0
        warning: 400.0
        critical: 800.0
      p99:
        target: 500.0
        warning: 1000.0
        critical: 2000.0
    endpoints:
      health_check:
        p50: 50.0
        p95: 100.0
        p99: 200.0
      metrics:
        p50: 100.0
        p95: 200.0
        p99: 500.0
      alerts:
        p50: 150.0
        p95: 300.0
        p99: 800.0
      ai_inference:
        p50: 500.0
        p95: 2000.0
        p99: 5000.0

  # AI Inference Latency KPIs
  ai_inference_latency:
    name: "AI Inference Latency"
    description: "AI model inference latency metrics"
    enabled: true
    unit: "milliseconds"
    models:
      gpt_4:
        target: 2000.0
        warning: 5000.0
        critical: 10000.0
      gpt_35_turbo:
        target: 1000.0
        warning: 2000.0
        critical: 5000.0
      claude:
        target: 1500.0
        warning: 3000.0
        critical: 8000.0
      local_llm:
        target: 500.0
        warning: 1000.0
        critical: 2000.0
    operations:
      text_generation:
        target: 1000.0
        warning: 2000.0
        critical: 5000.0
      embedding:
        target: 100.0
        warning: 200.0
        critical: 500.0
      retrieval:
        target: 500.0
        warning: 1000.0
        critical: 2000.0

  # Knowledge Graph Query KPIs
  knowledge_graph_query:
    name: "Knowledge Graph Query"
    description: "Knowledge graph query performance metrics"
    enabled: true
    unit: "milliseconds"
    query_types:
      simple_lookup:
        target: 50.0
        warning: 100.0
        critical: 200.0
      complex_traversal:
        target: 200.0
        warning: 500.0
        critical: 1000.0
      reasoning:
        target: 500.0
        warning: 1000.0
        critical: 2000.0
      batch_query:
        target: 1000.0
        warning: 2000.0
        critical: 5000.0
    cache_hit_rate:
      target: 0.90
      warning: 0.80
      critical: 0.70

  # Workflow Execution KPIs
  workflow_execution:
    name: "Workflow Execution"
    description: "Workflow execution performance metrics"
    enabled: true
    unit: "seconds"
    workflow_types:
      simple:
        target: 5.0
        warning: 10.0
        critical: 30.0
      complex:
        target: 30.0
        warning: 60.0
        critical: 120.0
      multi_step:
        target: 60.0
        warning: 120.0
        critical: 300.0
      ai_assisted:
        target: 120.0
        warning: 300.0
        critical: 600.0
    step_success_rate:
      target: 0.99
      warning: 0.95
      critical: 0.90

  # Resource Usage KPIs
  resource_usage:
    name: "Resource Usage"
    description: "System resource utilization metrics"
    enabled: true
    cpu:
      target: 70.0
      warning: 85.0
      critical: 95.0
      unit: "percent"
    memory:
      target: 70.0
      warning: 85.0
      critical: 95.0
      unit: "percent"
    disk:
      target: 80.0
      warning: 90.0
      critical: 95.0
      unit: "percent"
    network:
      inbound:
        target: 1000000000.0  # 1 Gbps
        warning: 2000000000.0  # 2 Gbps
        critical: 5000000000.0  # 5 Gbps
        unit: "bytes_per_second"
      outbound:
        target: 1000000000.0  # 1 Gbps
        warning: 2000000000.0  # 2 Gbps
        critical: 5000000000.0  # 5 Gbps
        unit: "bytes_per_second"

  # Error Rate KPIs
  error_rate:
    name: "Error Rate"
    description: "System error rate metrics"
    enabled: true
    unit: "percent"
    total_errors:
      target: 0.1
      warning: 1.0
      critical: 5.0
    api_errors:
      target: 0.05
      warning: 0.5
      critical: 2.0
    ai_errors:
      target: 0.5
      warning: 2.0
      critical: 5.0
    database_errors:
      target: 0.01
      warning: 0.1
      critical: 1.0

slo:
  # Availability SLOs
  availability:
    name: "Service Availability"
    description: "Service uptime and availability targets"
    enabled: true
    targets:
      overall:
        target: 0.999  # 99.9%
        window: "30d"
        alert_threshold: 0.998
      api:
        target: 0.9995  # 99.95%
        window: "7d"
        alert_threshold: 0.999
      ai_services:
        target: 0.99  # 99%
        window: "30d"
        alert_threshold: 0.98
      database:
        target: 0.9999  # 99.99%
        window: "30d"
        alert_threshold: 0.9995
    aggregation: "uptime"

  # Performance SLOs
  performance:
    name: "Performance Targets"
    description: "Performance-related SLOs"
    enabled: true
    targets:
      api_response_time:
        target: 0.95  # 95% of requests under 200ms
        window: "24h"
        alert_threshold: 0.90
        metric: "api_response_time_p95"
        aggregation: "p99_lt"
      ai_inference:
        target: 0.90  # 90% of inferences under 2s
        window: "24h"
        alert_threshold: 0.85
        metric: "ai_inference_latency"
        aggregation: "p99_lt"
      workflow_execution:
        target: 0.95  # 95% of workflows complete in time
        window: "7d"
        alert_threshold: 0.90
        metric: "workflow_success_rate"
        aggregation: "good_ratio"

  # Throughput SLOs
  throughput:
    name: "Throughput Targets"
    description: "System throughput capacity targets"
    enabled: true
    targets:
      api_requests:
        target: 1000.0  # requests per second
        window: "1h"
        alert_threshold: 800.0
        metric: "api_throughput"
        aggregation: "mean_lt"
      ai_inferences:
        target: 100.0  # inferences per second
        window: "1h"
        alert_threshold: 80.0
        metric: "ai_throughput"
        aggregation: "mean_lt"
      database_queries:
        target: 5000.0  # queries per second
        window: "1h"
        alert_threshold: 4000.0
        metric: "db_throughput"
        aggregation: "mean_lt"

  # Data Quality SLOs
  data_quality:
    name: "Data Quality"
    description: "Data quality and integrity targets"
    enabled: true
    targets:
      metric_accuracy:
        target: 0.99
        window: "24h"
        alert_threshold: 0.95
        metric: "metric_accuracy"
        aggregation: "good_ratio"
      data_freshness:
        target: 0.95
        window: "1h"
        alert_threshold: 0.90
        metric: "data_freshness"
        aggregation: "good_ratio"

# Alert Configuration
alerts:
  enabled: true
  channels:
    - email
    - slack
    - pagerduty
  severity_levels:
    info:
      enabled: true
      throttle: "5m"
    warning:
      enabled: true
      throttle: "10m"
    critical:
      enabled: true
      throttle: "1m"
      escalation: "5m"
  notification_rules:
    availability_breach:
      severity: "critical"
      channels: ["pagerduty", "slack", "email"]
    performance_degradation:
      severity: "warning"
      channels: ["slack", "email"]
    resource_exhaustion:
      severity: "critical"
      channels: ["pagerduty", "slack"]
    error_spike:
      severity: "warning"
      channels: ["slack", "email"]

# Error Budget Configuration
error_budget:
  enabled: true
  calculation_method: "rolling_window"
  burn_rate_thresholds:
    warning: 2.0
    critical: 10.0
  alert_on_burn_rate: true
  alert_on_remaining_budget:
    warning: 50.0  # percent
    critical: 10.0  # percent

# Reporting Configuration
reporting:
  enabled: true
  schedule:
    daily: "00:00"
    weekly: "Monday 08:00"
    monthly: "1st 00:00"
  formats:
    - json
    - html
    - pdf
  retention:
    daily: 30  # days
    weekly: 52  # weeks
    monthly: 36  # months
  include_sections:
    - executive_summary
    - kpi_summary
    - slo_compliance
    - error_budget
    - trends
    - recommendations

# Historical Data Tracking
historical_tracking:
  enabled: true
  retention_period: 90  # days
  aggregation_intervals:
    - "1m"
    - "5m"
    - "15m"
    - "1h"
    - "1d"
  storage:
    backend: "database"
    compression: true
    downsample: true

# Predictive Analysis
predictive_analysis:
  enabled: true
  models:
    - linear_regression
    - moving_average
    - exponential_smoothing
  forecast_horizon: 7  # days
  confidence_interval: 0.95
  alert_on_prediction:
    enabled: true
    threshold: 0.80  # confidence threshold
