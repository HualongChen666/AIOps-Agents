# Development Environment Configuration
# 开发环境配置

environment: development
debug: true
app_name: "AIOps Agent"
app_version: "1.0.0"
host: "0.0.0.0"
port: 8000
workers: 1

# Database Configuration
database:
  host: "localhost"
  port: 5432
  database: "aiops_dev"
  username: "postgres"
  password: "dev_password"
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30
  pool_recycle: 3600

# Redis Configuration
redis:
  host: "localhost"
  port: 6379
  db: 0
  password: null
  pool_size: 5
  socket_timeout: 5

# Security Configuration
security:
  jwt_secret_key: "dev-secret-key-change-me"
  jwt_algorithm: "HS256"
  jwt_access_token_expire_minutes: 30
  jwt_refresh_token_expire_days: 7
  tls_enabled: false
  tls_cert_path: null
  tls_key_path: null
  mfa_enabled: false
  password_policy_enabled: true
  rate_limiting_enabled: false
  rate_limit_max_requests: 1000
  rate_limit_time_window: 60

# Monitoring Configuration
monitoring:
  enabled: true
  prometheus_port: 9090
  metrics_path: "/metrics"
  tracing_enabled: true
  tracing_sample_rate: 1.0
  log_level: "DEBUG"

# AI Configuration
ai:
  enabled: true
  model_provider: "openai"
  model_name: "gpt-4o-mini"
  api_key: null
  api_base: null
  max_tokens: 2000
  temperature: 0.7
  timeout: 30
  retry_attempts: 3
  cache_enabled: true
  cache_ttl: 300

# CORS Configuration
cors_origins: ["*"]
cors_allow_credentials: true
cors_allow_methods: ["*"]
cors_allow_headers: ["*"]