# docker compose -f infrastructure/integration-test.yml up --wait
# Full integration test stack for AIOps Agent.
# Includes PostgreSQL primary/replica with Pgpool-II read/write splitting,
# a Redis Cluster, a 3-node Qdrant cluster and a single-node Kafka (KRaft).

services:
  # PostgreSQL primary node.
  postgres-primary:
    image: bitnami/postgresql-repmgr:16
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: adminpass
      POSTGRESQL_USERNAME: testuser
      POSTGRESQL_PASSWORD: testpass
      POSTGRESQL_DATABASE: test_db
      REPMGR_PASSWORD: repmgrpass
      REPMGR_PRIMARY_HOST: postgres-primary
      REPMGR_PRIMARY_PORT: 5432
      REPMGR_PARTNER_NODES: postgres-primary:5432,postgres-replica:5432
      REPMGR_NODE_NAME: postgres-primary
      REPMGR_NODE_NETWORK_NAME: postgres-primary
      REPMGR_PORT_NUMBER: 5432
      REPMGR_CONNECT_TIMEOUT: 5
      REPMGR_RECONNECT_ATTEMPTS: 3
      REPMGR_RECONNECT_INTERVAL: 5
    volumes:
      - postgres_primary_data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d test_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aiops-integration

  # PostgreSQL replica node.
  postgres-replica:
    image: bitnami/postgresql-repmgr:16
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: adminpass
      POSTGRESQL_USERNAME: testuser
      POSTGRESQL_PASSWORD: testpass
      POSTGRESQL_DATABASE: test_db
      REPMGR_PASSWORD: repmgrpass
      REPMGR_PRIMARY_HOST: postgres-primary
      REPMGR_PRIMARY_PORT: 5432
      REPMGR_PARTNER_NODES: postgres-primary:5432,postgres-replica:5432
      REPMGR_NODE_NAME: postgres-replica
      REPMGR_NODE_NETWORK_NAME: postgres-replica
      REPMGR_PORT_NUMBER: 5432
      REPMGR_CONNECT_TIMEOUT: 5
      REPMGR_RECONNECT_ATTEMPTS: 3
      REPMGR_RECONNECT_INTERVAL: 5
    depends_on:
      postgres-primary:
        condition: service_healthy
    volumes:
      - postgres_replica_data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d test_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aiops-integration

  # Pgpool-II for read/write splitting and connection pooling.
  pgpool:
    image: bitnami/pgpool:4
    ports:
      - "5432:5432"
    environment:
      PGPOOL_BACKEND_NODES: 0:postgres-primary:5432,1:postgres-replica:5432
      PGPOOL_SR_CHECK_USER: testuser
      PGPOOL_SR_CHECK_PASSWORD: testpass
      PGPOOL_POSTGRES_USERNAME: testuser
      PGPOOL_POSTGRES_PASSWORD: testpass
      PGPOOL_ADMIN_USERNAME: admin
      PGPOOL_ADMIN_PASSWORD: adminpass
      PGPOOL_ENABLE_LOAD_BALANCING: "yes"
      PGPOOL_ENABLE_STATEMENT_LOAD_BALANCING: "no"
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=testpass psql -U testuser -d test_db -h localhost -p 5432 -c 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aiops-integration

  # Redis Cluster: 6 nodes (3 masters + 3 replicas).
  redis-node-0:
    image: bitnami/redis-cluster:7.2
    environment:
      REDIS_PASSWORD: testpass
      REDIS_CLUSTER_REPLICAS: 1
      REDIS_NODES: redis-node-0,redis-node-1,redis-node-2,redis-node-3,redis-node-4,redis-node-5
      REDIS_CLUSTER_CREATOR: "no"
      REDIS_PORT_NUMBER: 6379
    networks:
      - aiops-integration

  redis-node-1:
    image: bitnami/redis-cluster:7.2
    environment:
      REDIS_PASSWORD: testpass
      REDIS_CLUSTER_REPLICAS: 1
      REDIS_NODES: redis-node-0,redis-node-1,redis-node-2,redis-node-3,redis-node-4,redis-node-5
      REDIS_CLUSTER_CREATOR: "no"
      REDIS_PORT_NUMBER: 6379
    networks:
      - aiops-integration

  redis-node-2:
    image: bitnami/redis-cluster:7.2
    environment:
      REDIS_PASSWORD: testpass
      REDIS_CLUSTER_REPLICAS: 1
      REDIS_NODES: redis-node-0,redis-node-1,redis-node-2,redis-node-3,redis-node-4,redis-node-5
      REDIS_CLUSTER_CREATOR: "no"
      REDIS_PORT_NUMBER: 6379
    networks:
      - aiops-integration

  redis-node-3:
    image: bitnami/redis-cluster:7.2
    environment:
      REDIS_PASSWORD: testpass
      REDIS_CLUSTER_REPLICAS: 1
      REDIS_NODES: redis-node-0,redis-node-1,redis-node-2,redis-node-3,redis-node-4,redis-node-5
      REDIS_CLUSTER_CREATOR: "no"
      REDIS_PORT_NUMBER: 6379
    networks:
      - aiops-integration

  redis-node-4:
    image: bitnami/redis-cluster:7.2
    environment:
      REDIS_PASSWORD: testpass
      REDIS_CLUSTER_REPLICAS: 1
      REDIS_NODES: redis-node-0,redis-node-1,redis-node-2,redis-node-3,redis-node-4,redis-node-5
      REDIS_CLUSTER_CREATOR: "no"
      REDIS_PORT_NUMBER: 6379
    networks:
      - aiops-integration

  redis-node-5:
    image: bitnami/redis-cluster:7.2
    environment:
      REDIS_PASSWORD: testpass
      REDIS_CLUSTER_REPLICAS: 1
      REDIS_NODES: redis-node-0,redis-node-1,redis-node-2,redis-node-3,redis-node-4,redis-node-5
      REDIS_CLUSTER_CREATOR: "yes"
      REDIS_PORT_NUMBER: 6379
    depends_on:
      - redis-node-0
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
    networks:
      - aiops-integration

  # Expose Redis Cluster on a single port for local testing.
  redis-cluster-proxy:
    image: bitnami/redis-cluster:7.2
    command: >
      sh -c "sleep 15 && redis-cli -a testpass -h redis-node-0 -p 6379 CLUSTER SLOTS | head"
    depends_on:
      - redis-node-5
    ports:
      - "6379:6379"
    networks:
      - aiops-integration

  # Qdrant: 3-node cluster.
  qdrant-node-1:
    image: qdrant/qdrant:v1.9.0
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__CLUSTER__ENABLED: "true"
      QDRANT__CLUSTER__P2P__PORT: 6335
      QDRANT__CLUSTER__CONSENSUS__ENABLED: "true"
      QDRANT__STORAGE__STORAGE_PATH_PREFIX: /qdrant/storage
    volumes:
      - qdrant1_data:/qdrant/storage
    networks:
      - aiops-integration

  qdrant-node-2:
    image: qdrant/qdrant:v1.9.0
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__CLUSTER__ENABLED: "true"
      QDRANT__CLUSTER__P2P__PORT: 6335
      QDRANT__CLUSTER__CONSENSUS__ENABLED: "true"
      QDRANT__STORAGE__STORAGE_PATH_PREFIX: /qdrant/storage
    volumes:
      - qdrant2_data:/qdrant/storage
    networks:
      - aiops-integration

  qdrant-node-3:
    image: qdrant/qdrant:v1.9.0
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__CLUSTER__ENABLED: "true"
      QDRANT__CLUSTER__P2P__PORT: 6335
      QDRANT__CLUSTER__CONSENSUS__ENABLED: "true"
      QDRANT__STORAGE__STORAGE_PATH_PREFIX: /qdrant/storage
    volumes:
      - qdrant3_data:/qdrant/storage
    networks:
      - aiops-integration

  # Kafka single-node (KRaft) for integration tests.
  kafka:
    image: bitnami/kafka:3.6
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_KRAFT_CLUSTER_ID: aiops-kraft-cluster-01
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - aiops-integration

volumes:
  postgres_primary_data:
  postgres_replica_data:
  qdrant1_data:
  qdrant2_data:
  qdrant3_data:
  kafka_data:

networks:
  aiops-integration:
    driver: bridge
