# Fluentd Configuration for Log Collection
# Fluentd日志收集配置

# Input sources
<source>
  @type tail
  @id input_tail
  path /var/log/aiops/*.log
  pos_file /var/log/fluentd/aiops.log.pos
  tag aiops.application
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%L%z
  </parse>
</source>

<source>
  @type tail
  @id input_tail_json
  path /var/log/aiops/*.json
  pos_file /var/log/fluentd/aiops.json.pos
  tag aiops.application
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%L%z
  </parse>
</source>

<source>
  @type tail
  @id input_access
  path /var/log/nginx/access.log
  pos_file /var/log/fluentd/nginx.access.pos
  tag aiops.access
  <parse>
    @type regexp
    expression /^(?<remote>[^ ]*) (?<host>[^ ]*) (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>[^\"]*)")?$/
    time_key time
    time_format %d/%b/%Y:%H:%M:%S %z
  </parse>
</source>

# Filters for log enrichment
<filter aiops.**>
  @type record_transformer
  <record>
    hostname "#{Socket.gethostname}"
    environment "#{ENV['ENVIRONMENT'] || 'development'}"
  </record>
</filter>

<filter aiops.application>
  @type grep
  <regexp>
    key level
    pattern /(ERROR|CRITICAL)/
  </regexp>
</filter>

# Output to Elasticsearch
<match aiops.**>
  @type elasticsearch
  host "#{ENV['ELASTICSEARCH_HOST'] || 'localhost'}"
  port "#{ENV['ELASTICSEARCH_PORT'] || 9200}"
  logstash_format true
  logstash_prefix aiops-logs
  logstash_dateformat %Y.%m.%d
  include_tag_key true
  type_name _doc
  <buffer>
    @type file
    path /var/log/fluentd/buffer
    flush_mode interval
    flush_interval 10s
    chunk_limit_size 10MB
    total_limit_size 50GB
  </buffer>
</match>

# Output to stdout for debugging
# <match aiops.**>
#   @type stdout
# </match>

# Error handling
<system>
  @log_level "#{ENV['LOG_LEVEL'] || 'info'}"
</system>
