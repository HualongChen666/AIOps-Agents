global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Alert/recording rules evaluated by this Prometheus. The files are mounted from
# monitoring/prometheus/alerts (see docker-compose.yml) so the root dev stack
# evaluates the same rules as the monitoring stack instead of shipping an empty
# rule set.
rule_files:
  - "/etc/prometheus/alerts/*.yml"

scrape_configs:
  # AIOps Agent application metrics (unified default registry, exposed at /metrics).
  - job_name: 'aiops-agent'
    static_configs:
      - targets: ['aiops-agent:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Host metrics (node_exporter runs in this stack, see docker-compose.yml).
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
