# Production Docker Compose configuration for AIOps Agent
version: '3.8'

services:
  aiops-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
    image: aiops-agent:latest
    container_name: aiops-agent
    restart: unless-stopped
    ports:
      - "8000:8000"  # API
      - "9090:9090"  # Metrics
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - "JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (>=32 chars)}"
      - "DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set for production}"
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - METRICS_ENABLED=true
      - RATE_LIMIT_ENABLED=true
      - ALERT_RULES_ENABLED=true
    volumes:
      - aiops-data:/app/data
      - aiops-logs:/app/logs
      - aiops-config:/app/config
    depends_on:
      - redis
      - victoria-metrics
    networks:
      - aiops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: aiops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - aiops-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.97.1
    container_name: aiops-victoria-metrics
    restart: unless-stopped
    ports:
      - "8428:8428"
    volumes:
      - victoria-data:/victoria-metrics-data
      - ../victoria-config/prometheus.yml:/etc/victoriametrics/prometheus.yml:ro
    networks:
      - aiops-network
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--httpListenAddr=:8428"
      - "--retentionPeriod=30d"
      - "--promscrape.config=/etc/victoriametrics/prometheus.yml"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8428/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # vmalert evaluates the alert/recording rules and notifies Alertmanager.
  # (VictoriaMetrics itself does not evaluate rule files.)
  vmalert:
    image: victoriametrics/vmalert:v1.97.1
    container_name: aiops-vmalert
    restart: unless-stopped
    ports:
      - "8880:8880"
    volumes:
      - ../victoria-config/alert-rules.yml:/etc/vmalert/alert-rules.yml:ro
      - ../victoria-config/recording-rules.yml:/etc/vmalert/recording-rules.yml:ro
    networks:
      - aiops-network
    command:
      - "--datasource.url=http://victoriametrics:8428"
      - "--remoteWrite.url=http://victoriametrics:8428"
      - "--notifier.url=http://alertmanager:9093"
      - "--rule=/etc/vmalert/alert-rules.yml"
      - "--rule=/etc/vmalert/recording-rules.yml"
      - "--evaluationInterval=30s"
      - "--httpListenAddr=:8880"
    depends_on:
      - victoria-metrics
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: aiops-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ../victoria-config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - aiops-network
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: aiops-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    networks:
      - aiops-network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: aiops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - "GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}"
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - aiops-network
    depends_on:
      - victoria-metrics

volumes:
  aiops-data:
    driver: local
  aiops-logs:
    driver: local
  aiops-config:
    driver: local
  redis-data:
    driver: local
  victoria-data:
    driver: local
  grafana-data:
    driver: local

networks:
  aiops-network:
    driver: bridge
