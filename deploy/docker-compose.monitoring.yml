version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: aiops-prometheus
    ports:
      - "9090:9090"
    # The AIOps API and the standalone services run on the host, so make
    # host.docker.internal resolvable on Linux as well as Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=50GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      # Required so Tempo's metrics-generator can remote-write RED metrics.
      - '--web.enable-remote-write-receiver'
    restart: unless-stopped
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:10.2.0
    container_name: aiops-grafana
    ports:
      - "3001:3000"
    volumes:
      # Provisioning + dashboards come from the repository-level grafana/ tree.
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: aiops-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.6.0
    container_name: aiops-node-exporter
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    restart: unless-stopped
    networks:
      - monitoring

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.12.0
    container_name: aiops-postgres-exporter
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME="postgresql://user:password@localhost:5432/aiops?sslmode=disable"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - monitoring

  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    container_name: aiops-redis-exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - monitoring

  # Loki - log aggregation. Consumes loki-config/loki.yml (server + LogQL rules).
  loki:
    image: grafana/loki:2.9.3
    container_name: aiops-loki
    ports:
      - "3100:3100"
    volumes:
      - ../loki-config/loki.yml:/etc/loki/loki.yml:ro
      # Loki ruler reads LogQL rules from <ruler.storage.local.directory>/<tenant>/.
      # auth_enabled=false => the single tenant is "fake".
      - ../loki-config/alert-rules.yml:/etc/loki/rules/fake/aiops-rules.yml:ro
      - loki-data:/loki
    command:
      - '-config.file=/etc/loki/loki.yml'
    restart: unless-stopped
    networks:
      - monitoring

  # Promtail - ships the agent + container logs to Loki.
  promtail:
    image: grafana/promtail:2.9.3
    container_name: aiops-promtail
    volumes:
      - ../loki-config/promtail.yml:/etc/promtail/promtail.yml:ro
      - ../logs:/var/log/aiops-agent:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    command:
      - '-config.file=/etc/promtail/promtail.yml'
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - monitoring

  # Tempo - distributed tracing. Consumes tempo-config/tempo.yml; receives OTLP
  # on 4317/4318 and remote-writes generated RED metrics back to Prometheus.
  tempo:
    image: grafana/tempo:2.3.1
    container_name: aiops-tempo
    user: "0:0"
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
      - "14268:14268"
    volumes:
      - ../tempo-config/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    command:
      - '-config.file=/etc/tempo/tempo.yml'
    restart: unless-stopped
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  loki-data:
  promtail-positions:
  tempo-data:
