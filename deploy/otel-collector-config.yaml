# OpenTelemetry Collector configuration — single source of truth for the AIOps
# platform. Mounted by deploy/docker-compose.otel.yml.
#
# Fan-out model:
#   traces  -> Tempo          (OTLP gRPC)
#   metrics -> VictoriaMetrics / Prometheus (Prometheus remote-write)
#   logs    -> Loki           (Loki push API)
#
# Endpoints are read from the environment with working defaults so the collector
# starts out-of-the-box; there are no unresolved placeholder credentials.

receivers:
  # OTLP receiver for traces, metrics and logs
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # File log receiver for AIOps agent log files (repository ./logs -> /var/log/aiops)
  filelog:
    include:
      - /var/log/aiops/*.log
    start_at: beginning
    include_file_name: true
    include_file_path: true
    operators:
      - type: json_parser
        parse_from: body
      - type: move
        from: attributes.message
        to: body
      - type: add
        field: attributes.log_file
        value: ${literal(attributes["log.file.name"])}

processors:
  # Batch processor for efficient data transmission
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 4096

  # Memory limiter to prevent OOM
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15

  # Resource processor to tag every signal with the service/environment
  resource:
    attributes:
      - key: service.name
        value: aiops-collector
        action: upsert
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENVIRONMENT}
        action: upsert

exporters:
  # Prometheus remote-write (works with VictoriaMetrics at /api/v1/write and with
  # Prometheus started with --web.enable-remote-write-receiver)
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true
    timeout: 10s
    remote_write_queue:
      enabled: true
      queue_size: 10000

  # OTLP exporter for traces -> Tempo (gRPC receiver on 4317)
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    timeout: 10s
    sending_queue:
      enabled: true
      queue_size: 1000

  # Loki exporter for logs. Label set is derived from the resource attributes
  # (service.name -> job) by the collector; no static label mapping is needed.
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    tls:
      insecure: true
    timeout: 10s

extensions:
  # Health check extension
  health_check:
    endpoint: 0.0.0.0:13133

  # Pprof extension for profiling
  pprof:
    endpoint: 0.0.0.0:1777

  # Zpages extension for debugging
  zpages:
    endpoint: 0.0.0.0:55679

service:
  # Extensions must be declared as a list at the top of the service section.
  extensions: [health_check, pprof, zpages]
  pipelines:
    # Metrics pipeline
    metrics:
      receivers: [otlp]
      processors: [batch, memory_limiter, resource]
      exporters: [prometheusremotewrite]

    # Traces pipeline
    traces:
      receivers: [otlp]
      processors: [batch, memory_limiter, resource]
      exporters: [otlp/tempo]

    # Logs pipeline
    logs:
      receivers: [otlp, filelog]
      processors: [batch, memory_limiter, resource]
      exporters: [loki]
