version: "3.8"

services:
  aiops-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
      - ENABLE_ADDONS=false
      - RAG_ENABLED=false
      - LLM_ROUTER_ENABLED=false
      - TOPOLOGY_ENABLED=false
      - TRACING_ENABLED=false
      - LOG_AGGREGATION_ENABLED=false
      - INCIDENT_RESPONSE_ENABLED=false
      - WORKFLOW_ENABLED=false
      - INTEGRATIONS_ENABLED=false
      - SECURITY_SCANNING_ENABLED=false
      - PENETRATION_TESTING_ENABLED=false
      - PLUGINS_ENABLED=false
      - SHARDING_ENABLED=false
      - I18N_ENABLED=false
      - DOC_GENERATION_ENABLED=false
    volumes:
      - ./core:/app/core
      - ./api:/app/api
      - ./config.py:/app/config.py
      - ./main.py:/app/main.py
    depends_on:
      - redis
      - postgres
    networks:
      - aiops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - aiops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=aiops
      - POSTGRES_USER=aiops
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - aiops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
      - "9090:9090"
    volumes:
      # deploy/prometheus.yml scrapes the services defined in this compose file
      # (aiops-agent, redis, postgres) by their service names.
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Evaluate the same alert/recording rules as the monitoring stack.
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - aiops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Host metrics for the node_* panels of grafana/dashboards/aiops_enhanced_dashboard.json.
  node-exporter:
    image: prom/node-exporter:v1.6.0
    ports:
      - "9100:9100"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    networks:
      - aiops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3000:3000"
    environment:
      - "GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}"
    volumes:
      - grafana-data:/var/lib/grafana
      # Load the repository dashboards/datasources so panels actually render.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - aiops-network
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Test service
  aiops-test:
    build:
      context: .
      dockerfile: Dockerfile
    command: pytest tests/ -v --tb=short
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=test
    volumes:
      - ./core:/app/core
      - ./api:/app/api
      - ./tests:/app/tests
    depends_on:
      - redis
      - postgres
    networks:
      - aiops-network
    profiles:
      - test

networks:
  aiops-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:
