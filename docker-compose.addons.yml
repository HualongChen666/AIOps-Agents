    build: extensions/addons/ai-plus/rag_service
    ports:
      - "8001:8000"
    environment:
      - PYTHONPATH=/app
      - RAG_ENABLED=true
    networks:
      - aiops-network
    profiles:
      - ai-plus
      - all-addons

