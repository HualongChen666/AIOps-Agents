version: "3.8"

# Add-on microservices for the AIOps SRE Agent.
# Use with: docker compose -f docker-compose.yml -f docker-compose.addons.yml --profile <profile> up
# Profiles: ai-plus, observability, operations, integrations, security, infrastructure, documentation, all-addons

services:
