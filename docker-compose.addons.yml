  # AI Plus Pack
  # ---------------------------------------------------------------------------
  rag-service:
    build:
      context: .
      dockerfile: extensions/addons/ai_plus/rag_service/Dockerfile
    ports:
      - "8001:9406"
    environment:
      - PYTHONPATH=/app
      - RAG_ENABLED=true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9406/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aiops-network
    profiles:
      - ai-plus
      - all-addons

