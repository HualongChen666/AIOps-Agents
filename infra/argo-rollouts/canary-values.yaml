# Argo Rollouts Canary Deployment Values
# These values control the canary deployment strategy

canary:
  enabled: true
  steps:
    # Initial canary deployment - 20% traffic
    - setWeight: 20
      pauseDuration: 10m
      analysisTemplates:
        - name: success-rate
          args:
            - name: service-name
              value: aiops-agent
    
    # Scale up to 40% traffic
    - setWeight: 40
      pauseDuration: 10m
      analysisTemplates:
        - name: success-rate
          args:
            - name: service-name
              value: aiops-agent
    
    # Scale up to 60% traffic
    - setWeight: 60
      pauseDuration: 10m
      analysisTemplates:
        - name: success-rate
          args:
            - name: service-name
              value: aiops-agent
    
    # Scale up to 80% traffic
    - setWeight: 80
      pauseDuration: 10m
      analysisTemplates:
        - name: success-rate
          args:
            - name: service-name
              value: aiops-agent
    
    # Final analysis before full rollout
    - analysis:
        templates:
          - name: success-rate
          - name: error-rate
          - name: latency-check
        args:
          - name: service-name
            value: aiops-agent
    
    # Full rollout
    - setWeight: 100

  # Analysis templates for automated validation
  analysisTemplates:
    success-rate:
      interval: 1m
      count: 5
      successCondition: result[0] >= 0.95
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{service="{{args.service-name}}",status=~"2.."}[1m]))
            /
            sum(rate(http_requests_total{service="{{args.service-name}"}[1m]))
    
    error-rate:
      interval: 1m
      count: 5
      successCondition: result[0] <= 0.02
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{service="{{args.service-name}}",status=~"5.."}[1m]))
            /
            sum(rate(http_requests_total{service="{{args.service-name}"}[1m]))
    
    latency-check:
      interval: 1m
      count: 5
      successCondition: result[0] <= 0.5
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            histogram_quantile(0.95,
              rate(http_request_duration_seconds_bucket{service="{{args.service-name}"}[1m])
            )

  # Rollback configuration
  rollback:
    enabled: true
    autoRollback: true
    rollbackOnErrorRate: 0.05
    rollbackOnLatency: 1.0
