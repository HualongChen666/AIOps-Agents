# Argo CD Application manifest (placeholder)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/${{ github.repository }}.git"
    targetRevision: HEAD
    path: .
  destination:
    server: "https://kubernetes.default.svc"
    namespace: aiops-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
