apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: aiops
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    
    metrics:
      enabled: true
      hostname: localhost
      port: 9090
      path: /metrics
    
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
        zipkin:
          endpoint: 0.0.0.0:9411
    
    ingester:
      lifecycler:
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
      max_block_duration: 5m
    
    compactor:
      compaction:
        block_retention: 48h
    
    storage:
      trace:
        backend: local
        local:
          path: /tmp/tempo/blocks
        wal:
          path: /tmp/tempo/wal
    
    overrides:
      defaults:
        metrics:
          global:
            enabled: true
          exemplars:
            enabled: true
        traces:
          max_lifespan: 48h
